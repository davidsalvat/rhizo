[package]
name = "xtask"
description = "Developer tasks for Rhizo: build, run and test the kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# JSON for benchmark results and the stored baseline (bench/baseline.json).
serde_json = "1"
# The cell file system, to encode the files a CPython cell starts with.
rhizo-fs = { path = "../crates/rhizo-fs" }
# The control protocol, to talk to a control kernel (`rhizo`, benchmarks).
rhizo-control = { path = "../crates/rhizo-control" }
# `AF_VSOCK` sockets, which the standard library lacks, to reach a control
# kernel on QEMU's vhost-vsock (MIT OR Apache-2.0; design D4 of
# `control-over-vsock`).
libc = "0.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
# Same as the workspace, except that xtask is a CLI and prints by design.
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
redundant_clone = "warn"
needless_pass_by_value = "warn"
unused_self = "warn"
