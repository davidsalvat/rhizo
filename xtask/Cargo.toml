[package]
name = "xtask"
description = "Developer tasks for Rhizo: build, run and test the kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# JSON for benchmark results and the stored baseline (bench/baseline.json).
serde_json = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
# Same as the workspace, except that xtask is a CLI and prints by design.
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
redundant_clone = "warn"
needless_pass_by_value = "warn"
unused_self = "warn"
