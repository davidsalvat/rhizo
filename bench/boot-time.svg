<svg xmlns="http://www.w3.org/2000/svg" width="784" height="358" viewBox="0 0 784 358" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">
  <title>Boot time: Rhizo against a reference Linux guest</title>
  <desc>Time from launching the VMM to the guest being ready, median, lower is better, per VMM: Rhizo bars next to the reference Linux guest's, with the speed-up.</desc>
  <text x="12" y="34" font-size="16" font-weight="600">Time from VMM launch to guest ready (median, lower is better)</text>
  <rect x="12" y="48" width="12" height="12" rx="2" fill="#2563eb" stroke="#2563eb"/>
  <text x="30" y="59">Rhizo</text>
  <rect x="132" y="48" width="12" height="12" rx="2" fill="#f97316" stroke="#c2410c"/>
  <text x="150" y="59">Linux (reference guest)</text>
  <text x="150" y="102" text-anchor="end" font-weight="600">Firecracker</text>
  <rect x="162" y="82" width="15.7" height="16" rx="3" fill="#2563eb" stroke="#2563eb"/>
  <text x="183.7" y="95.0">5.8 ms</text>
  <rect x="162" y="102" width="460.0" height="16" rx="3" fill="#f97316" stroke="#c2410c"/>
  <text x="628.0" y="115.0">168.8 ms</text>
  <text x="772" y="102" text-anchor="end" font-weight="600" fill="#2563eb">29× faster</text>
  <text x="150" y="158" text-anchor="end" font-weight="600">Cloud Hypervisor</text>
  <rect x="162" y="138" width="21.9" height="16" rx="3" fill="#2563eb" stroke="#2563eb"/>
  <text x="189.9" y="151.0">8.0 ms</text>
  <rect x="162" y="158" width="255.3" height="16" rx="3" fill="#f97316" stroke="#c2410c"/>
  <text x="423.3" y="171.0">93.7 ms</text>
  <text x="772" y="158" text-anchor="end" font-weight="600" fill="#2563eb">12× faster</text>
  <text x="150" y="214" text-anchor="end" font-weight="600">QEMU microvm</text>
  <rect x="162" y="194" width="112.8" height="16" rx="3" fill="#2563eb" stroke="#2563eb"/>
  <text x="280.8" y="207.0">41.4 ms</text>
  <text x="162" y="227.0" font-style="italic">not measured</text>
  <text x="150" y="270" text-anchor="end" font-weight="600">QEMU q35</text>
  <rect x="162" y="250" width="146.2" height="16" rx="3" fill="#2563eb" stroke="#2563eb"/>
  <text x="314.2" y="263.0">53.6 ms</text>
  <rect x="162" y="270" width="435.2" height="16" rx="3" fill="#f97316" stroke="#c2410c"/>
  <text x="603.2" y="283.0">159.7 ms</text>
  <text x="772" y="270" text-anchor="end" font-weight="600" fill="#2563eb">3× faster</text>
  <text x="12" y="336" font-size="12">Environment: ci, KVM: yes, 2026-11-21. Generated by cargo xtask bench --readme.</text>
</svg>
