schema: spec-driven

context: |
  Language: English
  All artifacts must be written in English.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: Rhizo, an MIT-licensed operating system kernel written in Rust whose
  basic unit is the "agent cell": an isolated environment that can be created,
  suspended, resumed and forked as native kernel operations. Proof of concept
  targeting x86_64 under QEMU/KVM. See README.md (thesis, roadmap H0-H7) and
  AGENTS.md (non-negotiable rules).

  Constraints every change must respect:
  - No GPL/AGPL/LGPL code may be copied into the repository.
  - Kernel core logic never touches hardware directly; hardware access goes
    through narrow interfaces so the core can run in a deterministic simulator.
  - Per-cell kernel state must be serializable and clonable (snapshot/fork).
  - Every change ships its own tests; performance-critical paths ship benchmarks.

rules:
  proposal:
    - State explicitly what is out of scope.
    - Name the roadmap milestone (H0-H7) the change belongs to, if any.
  design:
    - For each decision, list the alternatives considered and why they lost.
    - Call out every new external dependency and its license.
  tasks:
    - Each task states how it is verified (test, command or observable output).
