<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>The stack today versus Rhizo</title>
<desc>Today an agent runs on orchestrator, host Linux, a VMM or userspace kernel and often a guest Linux. With Rhizo, cells run directly on a kernel whose operations are create, suspend, resume and fork.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b98a5"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="799" height="469" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="32" y="46" font-size="20" fill="#e6edf3" font-weight="700">Today</text>
<text x="424" y="46" font-size="20" fill="#63d4a0" font-weight="700">With Rhizo</text>
<line x1="400" y1="30" x2="400" y2="400" stroke="#30363d" stroke-width="1"/>
<rect x="32" y="70" width="344" height="48" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<text x="204.0" y="100" font-size="17" fill="#e6edf3" text-anchor="middle">Orchestrator</text>
<line x1="204.0" y1="118" x2="204.0" y2="136" stroke="#8b98a5" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="32" y="138" width="344" height="48" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<text x="204.0" y="168" font-size="17" fill="#e6edf3" text-anchor="middle">Host Linux</text>
<line x1="204.0" y1="186" x2="204.0" y2="204" stroke="#8b98a5" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="32" y="206" width="344" height="48" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<text x="204.0" y="236" font-size="17" fill="#e6edf3" text-anchor="middle">VMM or userspace kernel</text>
<line x1="204.0" y1="254" x2="204.0" y2="272" stroke="#8b98a5" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="32" y="274" width="344" height="48" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<text x="204.0" y="304" font-size="17" fill="#e6edf3" text-anchor="middle">Guest Linux (often)</text>
<line x1="204.0" y1="322" x2="204.0" y2="340" stroke="#8b98a5" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="32" y="342" width="344" height="48" rx="8" fill="#0f2a1f" stroke="#63d4a0" stroke-width="1.5"/>
<text x="204.0" y="372" font-size="17" fill="#e6edf3" font-weight="600" text-anchor="middle">Agent code</text>
<rect x="424" y="70" width="344" height="48" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<text x="596.0" y="100" font-size="17" fill="#e6edf3" text-anchor="middle">Orchestrator</text>
<line x1="596.0" y1="118" x2="596.0" y2="136" stroke="#8b98a5" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="424" y="138" width="344" height="84" rx="8" fill="#0f2a1f" stroke="#63d4a0" stroke-width="2"/>
<text x="596.0" y="170" font-size="19" fill="#e6edf3" font-weight="700" text-anchor="middle">Rhizo kernel</text>
<text x="596.0" y="198" font-size="15" fill="#9ba7b3" text-anchor="middle">create · suspend · resume · fork</text>
<line x1="482" y1="222" x2="482" y2="260" stroke="#8b98a5" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="430" y="262" width="104" height="76" rx="38" fill="#0f2a1f" stroke="#63d4a0" stroke-width="1.5"/>
<text x="482" y="296" font-size="16" fill="#e6edf3" font-weight="600" text-anchor="middle">cell</text>
<text x="482" y="317" font-size="14" fill="#9ba7b3" text-anchor="middle">agent code</text>
<line x1="596" y1="222" x2="596" y2="260" stroke="#8b98a5" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="544" y="262" width="104" height="76" rx="38" fill="#0f2a1f" stroke="#63d4a0" stroke-width="1.5"/>
<text x="596" y="296" font-size="16" fill="#e6edf3" font-weight="600" text-anchor="middle">cell</text>
<text x="596" y="317" font-size="14" fill="#9ba7b3" text-anchor="middle">agent code</text>
<line x1="710" y1="222" x2="710" y2="260" stroke="#8b98a5" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="658" y="262" width="104" height="76" rx="38" fill="#0f2a1f" stroke="#63d4a0" stroke-width="1.5"/>
<text x="710" y="296" font-size="16" fill="#e6edf3" font-weight="600" text-anchor="middle">cell</text>
<text x="710" y="317" font-size="14" fill="#9ba7b3" text-anchor="middle">agent code</text>
<text x="596.0" y="370" font-size="14" fill="#9ba7b3" text-anchor="middle">thousands per node, most asleep</text>
<text x="32" y="432" font-size="15" fill="#9ba7b3">Snapshots, clones and isolation</text>
<text x="32" y="454" font-size="15" fill="#9ba7b3">are added from the outside.</text>
<text x="424" y="432" font-size="15" fill="#9ba7b3">Snapshot, resume and fork are</text>
<text x="424" y="454" font-size="15" fill="#9ba7b3">native operations of the kernel.</text>
</svg>
