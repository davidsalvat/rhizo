<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 674" width="800" height="674" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Where Rhizo stands</title>
<desc>7 of 9 stages done. The foundations (done): boots in milliseconds on arm and x86, tested on every change, 8 ms to boot (Firecracker). The cell (done): runs ordinary linux programs, each sealed off from the rest, 22 KB per idle cell. Native operations (done): pause, resume or copy a running cell in microseconds, 1.18 µs to fork a 50 MiB agent. Real programs (done): threads, networking, python and every processor core, 3.82 ms a Python request, warm. Proven with numbers (done): compared fairly with linux, vms and sandboxes; reviewed, 73× faster to start a program. A real agent (done): calls a model, explores branches, pauses between turns, 1.49 ms to fork a live agent three ways. Scale and compatibility (done): thousands of busy agents and everyday software, safely shared, 10,000 busy cells in one VM. Families and modules (next): agents in walled families; abilities added as signed modules. The product (vision): download a ready agent in two clicks, bring your own model.</desc>
