<text x="24" y="570" font-size="14" fill="#9ba7b3">GitHub-hosted runners with KVM (shared machines, nested virtualization). Rhizo runs</text>
<text x="24" y="589" font-size="14" fill="#9ba7b3">inside Firecracker, so both sides pay the same virtualization; Linux baselines run on the</text>
<text x="24" y="608" font-size="14" fill="#9ba7b3">host. Medians from cargo xtask bench.</text>
