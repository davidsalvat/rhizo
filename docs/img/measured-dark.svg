<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1742" width="800" height="1742" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Measured on the same machine</title>
<desc>Bar chart, lower is better, bars to scale within each comparison. Same operation, same kind of VM: a cell against a Linux process. Fork, holding 50 MiB (the fork call): Rhizo cell 1.78 µs, Linux fork() 256 µs. Fork, then the child writes all 50 MiB: Rhizo cell 3.21 ms, Linux fork + write 31.69 ms. Run hello, from start to exit: Rhizo cell 10 µs, Linux posix_spawn 521 µs. Resume a suspended 8 MiB program: Cell, lazy 0.96 µs, Cell, eager 254 µs, Cell, lazy + read all 243 µs, CRIU restore (host) 4.86 ms. CPython agent request, cold start: Rhizo cell 18.02 ms, Linux process 22.49 ms. CPython agent request, from a warm template: Rhizo cell 3.48 ms, Linux fork of warm 6.27 ms. numpy from PyPI wheels, cold start: Rhizo cell 67.97 ms, Linux process 75.41 ms. numpy from PyPI wheels, from a warm template: Rhizo cell 15.14 ms, Linux fork of warm 18.23 ms. Node.js agent request (Linux cannot fork Node.js): Cell, warm template 6.03 ms, Cell, cold 39.35 ms, Linux process, cold 50.08 ms. Answer a Python request (MicroPython): Warm template 434 µs, Cold interpreter 3.57 ms. Whole VMs and sandboxes: a larger scope, shown for scale. Resume a whole environment: Cell, eager 254 µs, Firecracker VM 3.67 ms, gVisor sandbox 106.98 ms. Run hello in a new environment: Rhizo cell 10 µs, gVisor sandbox 78.71 ms.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b98a5"/></marker><marker id="g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#63d4a0"/></marker><marker id="b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#79b8ff"/></marker><marker id="o" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2c14e"/></marker><marker id="r" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff8a80"/></marker><marker id="c" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#63d4a0"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="799" height="1741" rx="12" fill="#0d1117" stroke="#30363d"/>
