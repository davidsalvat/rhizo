<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1180" width="800" height="1180" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Measured on the same machine</title>
<desc>Log-scale bar chart, lower is better. Same operation, same kind of VM: a cell against a Linux process. Fork, holding 50 MiB (the fork call): Rhizo cell 1.45 µs, Linux fork() 87 µs. Fork, then the child writes all 50 MiB: Rhizo cell 7.45 ms, Linux fork + write 27.28 ms. Run hello, from start to exit: Rhizo cell 7.34 µs, Linux posix_spawn 534 µs. Resume a suspended 8 MiB program: Cell, lazy 1.04 µs, Cell, eager 594 µs, Cell, lazy + read all 625 µs, CRIU restore (host) 2.70 ms. Answer a Python request (MicroPython): Warm template 506 µs, Cold interpreter 3.64 ms. Whole VMs and sandboxes: a larger scope, shown for scale. Resume a whole environment: Cell, eager 594 µs, Firecracker VM 4.71 ms, gVisor sandbox 99.85 ms. Run hello in a new environment: Rhizo cell 7.34 µs, gVisor sandbox 70.58 ms.</desc>
