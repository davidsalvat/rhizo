<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 628" width="800" height="628" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Measured on the same machine</title>
<desc>Log-scale bar chart, lower is better. Resume: Rhizo 1.27 µs, Firecracker snapshot restore 3.74 ms. Fork with 50 MiB: Rhizo 1.48 µs, Linux fork 1.78 ms. Run hello: Rhizo 7.2 µs, Linux posix_spawn 112 µs. Start from a template: Rhizo 0.35 µs.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b98a5"/></marker></defs>
