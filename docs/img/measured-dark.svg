<text x="190" y="1079" font-size="14" fill="#9ba7b3" text-anchor="end">Linux fork of warm</text>
<rect x="200" y="1065" width="476.0" height="20" rx="3" fill="#768390" stroke="#768390" stroke-width="0"/>
<text x="684.0" y="1080" font-size="14" fill="#e6edf3" font-weight="400" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">16.06 ms</text>
