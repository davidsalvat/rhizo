<text x="24" y="64" font-size="14" fill="#9ba7b3">Time per operation; bars to scale within each comparison; lower is better</text>
<rect x="24" y="78" width="14" height="14" rx="3" fill="#63d4a0" stroke="#63d4a0" stroke-width="0"/>
<text x="44" y="90" font-size="14" fill="#e6edf3">Rhizo</text>
<rect x="110" y="78" width="14" height="14" rx="3" fill="#768390" stroke="#768390" stroke-width="0"/>
<text x="130" y="90" font-size="14" fill="#e6edf3">Existing mechanism, or a cold start</text>
<line x1="24" y1="118" x2="776" y2="118" stroke="#6e7681" stroke-width="1"/>
<text x="24" y="138" font-size="15" fill="#63d4a0" font-weight="700">Same operation, same kind of VM: a cell against a Linux process</text>
<text x="24" y="170" font-size="15" fill="#e6edf3" font-weight="700">Fork, holding 50 MiB (the fork call)</text>
<text x="776" y="170" font-size="15" fill="#63d4a0" font-weight="700" text-anchor="end">≈ 140× faster</text>
