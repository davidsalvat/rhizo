<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1404" width="800" height="1404" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Measured on the same machine</title>
<desc>Log-scale bar chart, lower is better. Same operation, same kind of VM: a cell against a Linux process. Fork, holding 50 MiB (the fork call): Rhizo cell 1.46 µs, Linux fork() 87 µs. Fork, then the child writes all 50 MiB: Rhizo cell 7.16 ms, Linux fork + write 27.11 ms. Run hello, from start to exit: Rhizo cell 7.35 µs, Linux posix_spawn 602 µs. Resume a suspended 8 MiB program: Cell, lazy 1.12 µs, Cell, eager 595 µs, Cell, lazy + read all 622 µs, CRIU restore (host) 2.72 ms. CPython agent request, cold start: Rhizo cell 18.31 ms, Linux process 18.55 ms. CPython agent request, from a warm template: Rhizo cell 3.66 ms, Linux fork of warm 5.55 ms. Answer a Python request (MicroPython): Warm template 496 µs, Cold interpreter 3.60 ms. Whole VMs and sandboxes: a larger scope, shown for scale. Resume a whole environment: Cell, eager 595 µs, Firecracker VM 3.72 ms, gVisor sandbox 102.01 ms. Run hello in a new environment: Rhizo cell 7.35 µs, gVisor sandbox 76.01 ms.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b98a5"/></marker></defs>
