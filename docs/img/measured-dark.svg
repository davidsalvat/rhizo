<text x="322.37235572815536" y="600" font-size="14" fill="#e6edf3" font-weight="700" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">619 µs</text>
<text x="190" y="631" font-size="14" fill="#9ba7b3" text-anchor="end">CRIU restore (host)</text>
<rect x="200" y="617" width="476.0" height="20" rx="3" fill="#768390" stroke="#768390" stroke-width="0"/>
<text x="684.0" y="632" font-size="14" fill="#e6edf3" font-weight="400" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2.58 ms</text>
<text x="24" y="682" font-size="15" fill="#e6edf3" font-weight="700">CPython agent request, cold start</text>
<text x="776" y="682" font-size="15" fill="#9ba7b3" font-weight="700" text-anchor="end">about the same</text>
