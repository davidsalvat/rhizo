<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1742" width="800" height="1742" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Measured on the same machine</title>
<desc>Bar chart, lower is better, bars to scale within each comparison. Same operation, same kind of VM: a cell against a Linux process. Fork, holding 50 MiB (the fork call): Rhizo cell 1.44 µs, Linux fork() 87 µs. Fork, then the child writes all 50 MiB: Rhizo cell 4.77 ms, Linux fork + write 23.94 ms. Run hello, from start to exit: Rhizo cell 7.03 µs, Linux posix_spawn 600 µs. Resume a suspended 8 MiB program: Cell, lazy 1.27 µs, Cell, eager 586 µs, Cell, lazy + read all 619 µs, CRIU restore (host) 2.58 ms. CPython agent request, cold start: Rhizo cell 17.10 ms, Linux process 18.30 ms. CPython agent request, from a warm template: Rhizo cell 3.85 ms, Linux fork of warm 5.58 ms. numpy from PyPI wheels, cold start: Rhizo cell 68.81 ms, Linux process 61.56 ms. numpy from PyPI wheels, from a warm template: Rhizo cell 15.08 ms, Linux fork of warm 16.06 ms. Node.js agent request (Linux cannot fork Node.js): Cell, warm template 4.48 ms, Cell, cold 35.91 ms, Linux process, cold 31.94 ms. Answer a Python request (MicroPython): Warm template 499 µs, Cold interpreter 3.43 ms. Whole VMs and sandboxes: a larger scope, shown for scale. Resume a whole environment: Cell, eager 586 µs, Firecracker VM 3.68 ms, gVisor sandbox 94.35 ms. Run hello in a new environment: Rhizo cell 7.03 µs, gVisor sandbox 64.24 ms.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b98a5"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="799" height="1741" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="24" y="40" font-size="20" fill="#e6edf3" font-weight="700">Measured on the same machine</text>
<text x="24" y="64" font-size="14" fill="#9ba7b3">Time per operation; bars to scale within each comparison; lower is better</text>
<rect x="24" y="78" width="14" height="14" rx="3" fill="#63d4a0" stroke="#63d4a0" stroke-width="0"/>
<text x="44" y="90" font-size="14" fill="#e6edf3">Rhizo</text>
<rect x="110" y="78" width="14" height="14" rx="3" fill="#768390" stroke="#768390" stroke-width="0"/>
<text x="130" y="90" font-size="14" fill="#e6edf3">Existing mechanism, or a cold start</text>
<line x1="24" y1="118" x2="776" y2="118" stroke="#3d444d" stroke-width="1"/>
<text x="24" y="138" font-size="15" fill="#63d4a0" font-weight="700">Same operation, same kind of VM: a cell against a Linux process</text>
<text x="24" y="170" font-size="15" fill="#e6edf3" font-weight="700">Fork, holding 50 MiB (the fork call)</text>
<text x="776" y="170" font-size="15" fill="#63d4a0" font-weight="700" text-anchor="end">≈ 61× faster</text>
<text x="190" y="199" font-size="14" fill="#e6edf3" text-anchor="end">Rhizo cell</text>
<rect x="200" y="185" width="7.8" height="20" rx="3" fill="#63d4a0" stroke="#63d4a0" stroke-width="0"/>
<text x="215.845015576324" y="200" font-size="14" fill="#e6edf3" font-weight="700" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1.44 µs</text>
<text x="190" y="231" font-size="14" fill="#9ba7b3" text-anchor="end">Linux fork()</text>
<rect x="200" y="217" width="476.0" height="20" rx="3" fill="#768390" stroke="#768390" stroke-width="0"/>
<text x="684.0" y="232" font-size="14" fill="#e6edf3" font-weight="400" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">87 µs</text>
<text x="24" y="282" font-size="15" fill="#e6edf3" font-weight="700">Fork, then the child writes all 50 MiB</text>
<text x="776" y="282" font-size="15" fill="#63d4a0" font-weight="700" text-anchor="end">≈ 5.0× faster</text>
<text x="190" y="311" font-size="14" fill="#e6edf3" text-anchor="end">Rhizo cell</text>
<rect x="200" y="297" width="94.8" height="20" rx="3" fill="#63d4a0" stroke="#63d4a0" stroke-width="0"/>
<text x="302.8184191402783" y="312" font-size="14" fill="#e6edf3" font-weight="700" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">4.77 ms</text>
<text x="190" y="343" font-size="14" fill="#9ba7b3" text-anchor="end">Linux fork + write</text>
<rect x="200" y="329" width="476.0" height="20" rx="3" fill="#768390" stroke="#768390" stroke-width="0"/>
<text x="684.0" y="344" font-size="14" fill="#e6edf3" font-weight="400" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">23.94 ms</text>
<text x="24" y="394" font-size="15" fill="#e6edf3" font-weight="700">Run hello, from start to exit</text>
<text x="776" y="394" font-size="15" fill="#63d4a0" font-weight="700" text-anchor="end">≈ 85× faster</text>
<text x="190" y="423" font-size="14" fill="#e6edf3" text-anchor="end">Rhizo cell</text>
<rect x="200" y="409" width="5.6" height="20" rx="3" fill="#63d4a0" stroke="#63d4a0" stroke-width="0"/>
<text x="213.57221797415508" y="424" font-size="14" fill="#e6edf3" font-weight="700" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">7.03 µs</text>
<text x="190" y="455" font-size="14" fill="#9ba7b3" text-anchor="end">Linux posix_spawn</text>
<rect x="200" y="441" width="476.0" height="20" rx="3" fill="#768390" stroke="#768390" stroke-width="0"/>
<text x="684.0" y="456" font-size="14" fill="#e6edf3" font-weight="400" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">600 µs</text>
<text x="24" y="506" font-size="15" fill="#e6edf3" font-weight="700">Resume a suspended 8 MiB program</text>
<text x="776" y="506" font-size="15" fill="#63d4a0" font-weight="700" text-anchor="end">≈ 4.4× faster</text>
<text x="190" y="535" font-size="14" fill="#e6edf3" text-anchor="end">Cell, lazy</text>
<rect x="200" y="521" width="3.0" height="20" rx="3" fill="#63d4a0" stroke="#63d4a0" stroke-width="0"/>
<text x="211.0" y="536" font-size="14" fill="#e6edf3" font-weight="700" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1.27 µs</text>
<text x="190" y="567" font-size="14" fill="#e6edf3" text-anchor="end">Cell, eager</text>
