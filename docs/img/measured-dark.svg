<line x1="24" y1="1378" x2="776" y2="1378" stroke="#3d444d" stroke-width="1"/>
<text x="24" y="1398" font-size="15" fill="#63d4a0" font-weight="700">Whole VMs and sandboxes: a larger scope, shown for scale</text>
