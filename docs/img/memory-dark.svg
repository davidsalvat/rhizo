<rect class="bg" x="0.5" y="0.5" width="799" height="469" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="24" y="40" font-size="20" fill="#e6edf3" font-weight="700">Memory: shared until written</text>
<text x="24" y="64" font-size="14" fill="#9ba7b3">Forks and snapshots only pay for the pages they change.</text>
<rect x="24" y="186" width="196" height="116" rx="18" fill="#0f2a1f" stroke="#63d4a0" stroke-width="2.5"/>
