<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Memory: shared until written</title>
<desc>A template holds its pages once. Three forks start from it and share every page; when a fork writes a page, it gets its own copy of that page only. Snapshots of suspended forks store only their own pages and refer to the shared ones, so fifty agents of one template cost little more than one.</desc>
