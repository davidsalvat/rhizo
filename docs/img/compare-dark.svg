<rect x="24" y="336" width="236" height="42" rx="8" fill="#0d1117" stroke="#6e7681" stroke-width="1.3"/>
<text x="142.0" y="361.5" font-size="13" fill="#e6edf3" text-anchor="middle">Hardware</text>
<text x="400.0" y="92" font-size="18" fill="#e6edf3" font-weight="700" text-anchor="middle">MicroVM</text>
<rect x="282" y="336" width="236" height="42" rx="8" fill="#0d1117" stroke="#6e7681" stroke-width="1.3"/>
<text x="400.0" y="361.5" font-size="13" fill="#e6edf3" text-anchor="middle">Hardware</text>
<text x="658.0" y="92" font-size="18" fill="#63d4a0" font-weight="700" text-anchor="middle">Rhizo cell</text>
<rect x="540" y="336" width="236" height="42" rx="8" fill="#0d1117" stroke="#6e7681" stroke-width="1.3"/>
<text x="658.0" y="361.5" font-size="13" fill="#e6edf3" text-anchor="middle">Hardware</text>
<text x="142.0" y="116" font-size="12.5" fill="#9ba7b3" text-anchor="middle">light, but one kernel for all</text>
<text x="400.0" y="116" font-size="12.5" fill="#9ba7b3" text-anchor="middle">a whole OS per agent</text>
<text x="658.0" y="116" font-size="12.5" fill="#9ba7b3" text-anchor="middle">many cells, one kernel built for them</text>
