<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Rhizo: a home for AI agents</title>
<desc>An AI agent is downloaded ready to use from a catalogue and starts in an instant inside a sealed cell. It works with your own model. It can be paused and resumed like saving a game, and cloned into branches that try different ideas in parallel, keeping the best one.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b98a5"/></marker><marker id="g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#63d4a0"/></marker><marker id="b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#79b8ff"/></marker><marker id="o" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f2c14e"/></marker><marker id="r" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff8a80"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="799" height="449" rx="12" fill="#0d1117" stroke="#30363d"/>
<rect x="206" y="24" width="570" height="400" rx="30" fill="#0d1117" stroke="#63d4a0" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="236" cy="56" r="17" fill="#63d4a0" stroke="none" stroke-width="1.5"/>
<g transform="translate(226.225 46.225) scale(0.814583)" fill="none" stroke="#0d1117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.4 9-8 11-4.6-2-8-6-8-11V5z" fill="none"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g>
<text x="262" y="52" font-size="17" fill="#63d4a0" font-weight="700">Sealed off</text>
<text x="262" y="71" font-size="13" fill="#9ba7b3">nothing gets in or out unless you allow it</text>
<rect x="24" y="40" width="158" height="156" rx="16" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/>
<g transform="translate(58 71) scale(1.25)" fill="none" stroke="#9ba7b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></g>
<g transform="translate(88 65) scale(1.25)" fill="none" stroke="#79b8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></g>
<g transform="translate(118 71) scale(1.25)" fill="none" stroke="#9ba7b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></g>
<text x="103" y="136" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Ready-made</text>
<text x="103" y="156" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">agents</text>
<text x="103" y="177" font-size="13" fill="#9ba7b3" text-anchor="middle">download and go</text>
<path d="M182 120 C 220 120, 230 206, 266 206" fill="none" stroke="#79b8ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#b)"/>
<circle cx="205" cy="140" r="13" fill="#79b8ff" stroke="none" stroke-width="1.5"/>
<g transform="translate(197.525 132.525) scale(0.622917)" fill="none" stroke="#0d1117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></g>
<rect x="24" y="262" width="158" height="150" rx="16" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/>
<g transform="translate(83 286) scale(1.66667)" fill="none" stroke="#79b8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></g>
<text x="103" y="358" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Your own model</text>
<text x="103" y="378" font-size="13" fill="#9ba7b3" text-anchor="middle">Ollama, llama.cpp,</text>
<text x="103" y="396" font-size="13" fill="#9ba7b3" text-anchor="middle">any API</text>
<path d="M182 320 C 225 320, 235 252, 266 252" fill="none" stroke="#79b8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#b)" stroke-dasharray="4 4"/>
