<g transform="translate(737 332) scale(0.583333)" fill="none" stroke="#768390" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></g>
<text x="230" y="326" font-size="15" fill="#e6edf3" font-weight="700">Pause and resume, like saving a game</text>
