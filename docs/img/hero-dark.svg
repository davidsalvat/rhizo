<g transform="translate(609 224) scale(1.08333)" fill="none" stroke="#768390" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="13" rx="4" fill="none"/><path d="M12 7V3.5"/><circle cx="12" cy="3" r="1.3"/><circle cx="9" cy="13" r="1.6" fill="#768390" stroke="none"/><circle cx="15" cy="13" r="1.6" fill="#768390" stroke="none"/><path d="M9.5 17h5"/></g>
<text x="644" y="232" font-size="14" fill="#9ba7b3" font-weight="700">Branch B</text>
