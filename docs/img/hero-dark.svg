<text x="644" y="328" font-size="14" fill="#9ba7b3" font-weight="700">Branch C</text>
<text x="644" y="347" font-size="12.5" fill="#9ba7b3">drop it</text>
<g transform="translate(737 326) scale(0.583333)" fill="none" stroke="#768390" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></g>
<text x="230" y="326" font-size="15" fill="#e6edf3" font-weight="700">Pause and resume, like saving a game</text>
<rect x="230" y="340" width="100" height="64" rx="10" fill="#0d1117" stroke="#6e7681" stroke-width="1.5"/>
<g transform="translate(243 361) scale(0.916667)" fill="none" stroke="#9ba7b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3"/><rect x="8" y="13" width="8" height="6" rx="1"/></g>
<text x="274" y="368" font-size="13" fill="#e6edf3" font-weight="700">Save 1</text>
<text x="274" y="386" font-size="12" fill="#9ba7b3">turn 2</text>
