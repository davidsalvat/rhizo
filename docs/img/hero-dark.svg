<g transform="translate(313 195) scale(1.75)" fill="none" stroke="#63d4a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="13" rx="4" fill="#0d1117"/><path d="M12 7V3.5"/><circle cx="12" cy="3" r="1.3"/><circle cx="9" cy="13" r="1.6" fill="#63d4a0" stroke="none"/><circle cx="15" cy="13" r="1.6" fill="#63d4a0" stroke="none"/><path d="M9.5 17h5"/></g>
<text x="334" y="266" font-size="15" fill="#e6edf3" font-weight="700" text-anchor="middle">Your agent</text>
<circle cx="398" cy="182" r="16" fill="#f2c14e" stroke="none" stroke-width="1.5"/>
<g transform="translate(388.8 172.8) scale(0.766667)" fill="none" stroke="#0d1117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="#0d1117" stroke="none"/></g>
<text x="334" y="132" font-size="15" fill="#e6edf3" font-weight="700" text-anchor="middle">Starts in an instant</text>
<text x="334" y="151" font-size="13" fill="#9ba7b3" text-anchor="middle">microseconds, not seconds</text>
<path d="M402 230 C 470 230, 500 135, 592 135" fill="none" stroke="#f2c14e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#o)"/>
<path d="M402 230 C 470 230, 500 237, 592 237" fill="none" stroke="#63d4a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g)"/>
<path d="M402 230 C 470 230, 500 339, 592 339" fill="none" stroke="#63d4a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g)"/>
<text x="496" y="98" font-size="15" fill="#e6edf3" font-weight="700" text-anchor="middle">Clone it</text>
<text x="496" y="117" font-size="13" fill="#9ba7b3" text-anchor="middle">try ideas in parallel</text>
<rect x="592" y="104" width="172" height="62" rx="22" fill="#0f2a1f" stroke="#f2c14e" stroke-width="2.5"/>
<g transform="translate(609 122) scale(1.08333)" fill="none" stroke="#63d4a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="13" rx="4" fill="none"/><path d="M12 7V3.5"/><circle cx="12" cy="3" r="1.3"/><circle cx="9" cy="13" r="1.6" fill="#63d4a0" stroke="none"/><circle cx="15" cy="13" r="1.6" fill="#63d4a0" stroke="none"/><path d="M9.5 17h5"/></g>
<text x="644" y="130" font-size="14" fill="#e6edf3" font-weight="700">Branch A</text>
<text x="644" y="149" font-size="12.5" fill="#f2c14e" font-weight="700">the best: keep it</text>
<circle cx="760" cy="108" r="13" fill="#f2c14e" stroke="none" stroke-width="1.5"/>
<g transform="translate(752.525 100.525) scale(0.622917)" fill="none" stroke="#0d1117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5-4.9-4.5 6.6-.8z" fill="#0d1117" stroke="none"/></g>
