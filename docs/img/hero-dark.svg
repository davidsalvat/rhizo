<text x="382" y="368" font-size="13" fill="#e6edf3" font-weight="700">Save 2</text>
<text x="382" y="386" font-size="12" fill="#9ba7b3">turn 5</text>
<rect x="446" y="340" width="100" height="64" rx="10" fill="#0d1117" stroke="#63d4a0" stroke-width="2"/>
<g transform="translate(459 361) scale(0.916667)" fill="none" stroke="#63d4a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3"/><rect x="8" y="13" width="8" height="6" rx="1"/></g>
<text x="490" y="368" font-size="13" fill="#e6edf3" font-weight="700">Save 3</text>
<text x="490" y="386" font-size="12" fill="#9ba7b3">now</text>
</svg>
