<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Rhizo: a home for AI agents</title>
<desc>An AI agent is downloaded ready to use from a catalogue and starts in an instant inside a sealed cell. It works with your own model. It can be paused and resumed like saving a game, and cloned into branches that try different ideas in parallel, keeping the best one.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b98a5"/></marker><marker id="g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#63d4a0"/></marker><marker id="b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#79b8ff"/></marker><marker id="o" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2c14e"/></marker><marker id="r" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff8a80"/></marker><marker id="c" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#63d4a0"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="799" height="449" rx="12" fill="#0d1117" stroke="#30363d"/>
<rect x="206" y="24" width="570" height="400" rx="30" fill="#0d1117" stroke="#63d4a0" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="236" cy="56" r="17" fill="#63d4a0" stroke="none" stroke-width="1.5"/>
<g transform="translate(226.225 46.225) scale(0.814583)" fill="none" stroke="#0d1117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.4 9-8 11-4.6-2-8-6-8-11V5z" fill="none"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g>
<text x="262" y="52" font-size="17" fill="#63d4a0" font-weight="700">Sealed off</text>
<text x="262" y="71" font-size="13" fill="#9ba7b3">nothing gets in or out unless you allow it</text>
<rect x="24" y="60" width="158" height="156" rx="16" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/>
<g transform="translate(58 91) scale(1.25)" fill="none" stroke="#9ba7b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></g>
<g transform="translate(88 85) scale(1.25)" fill="none" stroke="#79b8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></g>
<g transform="translate(118 91) scale(1.25)" fill="none" stroke="#9ba7b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></g>
<text x="103" y="156" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Ready-made</text>
<text x="103" y="176" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">agents</text>
<text x="103" y="197" font-size="13" fill="#9ba7b3" text-anchor="middle">download and go</text>
<line x1="182" y1="198" x2="266" y2="198" stroke="#79b8ff" stroke-width="2.2" marker-end="url(#b)"/>
<rect x="24" y="244" width="158" height="156" rx="16" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/>
<g transform="translate(83 270) scale(1.66667)" fill="none" stroke="#79b8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></g>
<text x="103" y="342" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Your own model</text>
<text x="103" y="362" font-size="13" fill="#9ba7b3" text-anchor="middle">Ollama, llama.cpp,</text>
<text x="103" y="380" font-size="13" fill="#9ba7b3" text-anchor="middle">any API</text>
<line x1="182" y1="262" x2="266" y2="262" stroke="#79b8ff" stroke-width="2" marker-end="url(#b)" stroke-dasharray="4 4"/>
<rect x="266" y="178" width="136" height="104" rx="18" fill="#0f2a1f" stroke="#63d4a0" stroke-width="2.5"/>
<g transform="translate(313 195) scale(1.75)" fill="none" stroke="#63d4a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="13" rx="4" fill="#0d1117"/><path d="M12 7V3.5"/><circle cx="12" cy="3" r="1.3"/><circle cx="9" cy="13" r="1.6" fill="#63d4a0" stroke="none"/><circle cx="15" cy="13" r="1.6" fill="#63d4a0" stroke="none"/><path d="M9.5 17h5"/></g>
<text x="334" y="266" font-size="15" fill="#e6edf3" font-weight="700" text-anchor="middle">Your agent</text>
<circle cx="398" cy="182" r="16" fill="#f2c14e" stroke="none" stroke-width="1.5"/>
<g transform="translate(388.8 172.8) scale(0.766667)" fill="none" stroke="#0d1117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="#0d1117" stroke="none"/></g>
<text x="334" y="132" font-size="15" fill="#e6edf3" font-weight="700" text-anchor="middle">Starts in an instant</text>
<text x="334" y="151" font-size="13" fill="#9ba7b3" text-anchor="middle">milliseconds, not seconds</text>
<path d="M402 230 C 480 230, 520 127, 556 127 H 592" fill="none" stroke="#f2c14e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#o)"/>
<path d="M402 230 C 480 230, 520 230, 556 230 H 592" fill="none" stroke="#63d4a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g)"/>
<path d="M402 230 C 480 230, 520 333, 556 333 H 592" fill="none" stroke="#63d4a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g)"/>
<text x="496" y="98" font-size="15" fill="#e6edf3" font-weight="700" text-anchor="middle">Clone it</text>
<text x="496" y="117" font-size="13" fill="#9ba7b3" text-anchor="middle">try ideas in parallel</text>
<rect x="592" y="96" width="172" height="62" rx="22" fill="#0f2a1f" stroke="#f2c14e" stroke-width="2.5"/>
<g transform="translate(609 114) scale(1.08333)" fill="none" stroke="#63d4a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="13" rx="4" fill="none"/><path d="M12 7V3.5"/><circle cx="12" cy="3" r="1.3"/><circle cx="9" cy="13" r="1.6" fill="#63d4a0" stroke="none"/><circle cx="15" cy="13" r="1.6" fill="#63d4a0" stroke="none"/><path d="M9.5 17h5"/></g>
<text x="644" y="122" font-size="14" fill="#e6edf3" font-weight="700">Branch A</text>
<text x="644" y="141" font-size="12.5" fill="#f2c14e" font-weight="700">the best: keep it</text>
<circle cx="760" cy="100" r="13" fill="#f2c14e" stroke="none" stroke-width="1.5"/>
<g transform="translate(752.525 92.525) scale(0.622917)" fill="none" stroke="#0d1117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5-4.9-4.5 6.6-.8z" fill="#0d1117" stroke="none"/></g>
<rect x="592" y="199" width="172" height="62" rx="22" fill="#161b22" stroke="#768390" stroke-width="1.5"/>
<g transform="translate(609 217) scale(1.08333)" fill="none" stroke="#768390" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="13" rx="4" fill="none"/><path d="M12 7V3.5"/><circle cx="12" cy="3" r="1.3"/><circle cx="9" cy="13" r="1.6" fill="#768390" stroke="none"/><circle cx="15" cy="13" r="1.6" fill="#768390" stroke="none"/><path d="M9.5 17h5"/></g>
<text x="644" y="225" font-size="14" fill="#9ba7b3" font-weight="700">Branch B</text>
<text x="644" y="244" font-size="12.5" fill="#9ba7b3">drop it</text>
<g transform="translate(737 223) scale(0.583333)" fill="none" stroke="#768390" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></g>
