<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 622" width="800" height="622" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Roadmap status</title>
<desc>Milestones H0 to H8 are done. H9, memory accounting and density, is in progress. Next: a gVisor comparison, a MicroPython workload and a dedicated benchmark machine.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57706a"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="799" height="621" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="40" font-size="20" fill="#0e2a20" font-weight="700">Proof of concept: 11 milestones done, 1 in progress</text>
<circle cx="33" cy="66" r="9" fill="#16784f"/>
<path d="M28.5 66l3 3l6-6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="48" y="71" font-size="14" fill="#4b5c55">Done</text>
<circle cx="119" cy="66" r="9" fill="#fff4d6" stroke="#875a00" stroke-width="2"/>
<path d="M119 59A7 7 0 0 1 119 73z" fill="#875a00"/>
<text x="134" y="71" font-size="14" fill="#4b5c55">In progress</text>
<circle cx="259" cy="66" r="8" fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="3 2.5"/>
<text x="274" y="71" font-size="14" fill="#4b5c55">Next</text>
<line x1="52" y1="109.0" x2="52" y2="585.0" stroke="#d0d7de" stroke-width="2"/>
<circle cx="52" cy="109.0" r="9" fill="#16784f"/>
<path d="M47.5 109.0l3 3l6-6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="114.5" font-size="15" fill="#146c4a" font-weight="700">H0</text>
<text x="128" y="114.5" font-size="15" fill="#0e2a20">Boot and test harness</text>
<text x="416" y="114.5" font-size="14" fill="#4b5c55">QEMU, serial console, in-kernel tests</text>
<circle cx="52" cy="143.0" r="9" fill="#16784f"/>
<path d="M47.5 143.0l3 3l6-6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="148.5" font-size="15" fill="#146c4a" font-weight="700">H1</text>
<text x="128" y="148.5" font-size="15" fill="#0e2a20">Memory, paging and heap</text>
<text x="416" y="148.5" font-size="14" fill="#4b5c55">higher half, W^X, CPU exceptions</text>
<circle cx="52" cy="177.0" r="9" fill="#16784f"/>
<path d="M47.5 177.0l3 3l6-6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="182.5" font-size="15" fill="#146c4a" font-weight="700">H1.5</text>
<text x="128" y="182.5" font-size="15" fill="#0e2a20">Fast boot and benchmarks</text>
<text x="416" y="182.5" font-size="14" fill="#4b5c55">Firecracker, Cloud Hypervisor, CI gates</text>
<circle cx="52" cy="211.0" r="9" fill="#16784f"/>
<path d="M47.5 211.0l3 3l6-6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
