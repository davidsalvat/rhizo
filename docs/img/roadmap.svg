<text x="128" y="318.5" font-size="15" fill="#0e2a20">Suspend and resume</text>
<text x="416" y="318.5" font-size="14" fill="#4b5c55">lazy restore, pages back on first touch</text>
<circle cx="52" cy="347.0" r="9" fill="#16784f"/>
