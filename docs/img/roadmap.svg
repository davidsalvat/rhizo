<text x="128" y="420.5" font-size="15" fill="#0e2a20">Comparisons</text>
<text x="416" y="420.5" font-size="14" fill="#4b5c55">against Firecracker and Linux, same machine</text>
<circle cx="52" cy="449.0" r="9" fill="#16784f"/>
<path d="M47.5 449.0l3 3l6-6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="454.5" font-size="15" fill="#146c4a" font-weight="700">H8</text>
<text x="128" y="454.5" font-size="15" fill="#0e2a20">Files per cell</text>
<text x="416" y="454.5" font-size="14" fill="#4b5c55">carried by snapshots, forks and templates</text>
<circle cx="52" cy="483.0" r="9" fill="#fff4d6" stroke="#875a00" stroke-width="2"/>
<path d="M52 476.0A7 7 0 0 1 52 490.0z" fill="#875a00"/>
<text x="76" y="488.5" font-size="15" fill="#875a00" font-weight="700">H9</text>
<text x="128" y="488.5" font-size="15" fill="#0e2a20" font-weight="700">Memory accounting and density</text>
<text x="416" y="488.5" font-size="14" fill="#4b5c55">goal: 1,000 idle cells</text>
<circle cx="52" cy="517.0" r="8" fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="3 2.5"/>
<text x="76" y="522.5" font-size="15" fill="#4b5c55">gVisor comparison</text>
<circle cx="52" cy="551.0" r="8" fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="3 2.5"/>
<text x="76" y="556.5" font-size="15" fill="#4b5c55">MicroPython workload</text>
<circle cx="52" cy="585.0" r="8" fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="3 2.5"/>
<text x="76" y="590.5" font-size="15" fill="#4b5c55">Dedicated benchmark machine</text>
