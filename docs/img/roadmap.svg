<text x="128" y="352.5" font-size="15" fill="#0e2a20">Fork and templates</text>
<text x="416" y="352.5" font-size="14" fill="#4b5c55">copy-on-write down to the page tables</text>
<circle cx="52" cy="381.0" r="9" fill="#16784f"/>
<path d="M47.5 381.0l3 3l6-6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="386.5" font-size="15" fill="#146c4a" font-weight="700">H6</text>
<text x="128" y="386.5" font-size="15" fill="#0e2a20">Real glibc programs</text>
<text x="416" y="386.5" font-size="14" fill="#4b5c55">differential tests; MicroPython pending</text>
<circle cx="52" cy="415.0" r="9" fill="#16784f"/>
<path d="M47.5 415.0l3 3l6-6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
