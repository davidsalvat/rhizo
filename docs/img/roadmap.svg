<text x="128" y="216.5" font-size="15" fill="#0e2a20">AArch64 as primary</text>
<text x="416" y="216.5" font-size="14" fill="#4b5c55">x86_64 kept as the second architecture</text>
<circle cx="52" cy="245.0" r="9" fill="#16784f"/>
<path d="M47.5 245.0l3 3l6-6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="250.5" font-size="15" fill="#146c4a" font-weight="700">H2</text>
<text x="128" y="250.5" font-size="15" fill="#0e2a20">First cell</text>
<text x="416" y="250.5" font-size="14" fill="#4b5c55">user mode, ELF loader, Linux system calls</text>
