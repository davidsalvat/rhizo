<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 624" width="800" height="624" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Host operations stop only the cell's CPUs</title>
<desc>Four CPUs run cells A, B and X over time. When the host suspends cell X: before, every CPU stopped for the operation; now, only the CPUs running X stop, and cells A and B keep running.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b98a5"/></marker><marker id="g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#63d4a0"/></marker><marker id="b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#79b8ff"/></marker><marker id="o" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2c14e"/></marker><marker id="r" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff8a80"/></marker><marker id="c" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#63d4a0"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="799" height="623" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="24" y="40" font-size="20" fill="#e6edf3" font-weight="700">Pausing one cell no longer pauses the others</text>
<text x="24" y="64" font-size="14" fill="#9ba7b3">The host suspends cell X while four CPUs run cells A, B and X.</text>
<g transform="translate(391 89) scale(0.583333)" fill="none" stroke="#ff8a80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="4" height="14" rx="1" fill="#ff8a80"/><rect x="14" y="5" width="4" height="14" rx="1" fill="#ff8a80"/></g>
<text x="410" y="101" font-size="13" fill="#ff8a80" font-weight="700">suspend X</text>
<text x="24" y="124" font-size="15" fill="#9ba7b3" font-weight="700">Before: every CPU stops</text>
<text x="98" y="166" font-size="13" fill="#9ba7b3" text-anchor="end">CPU 0</text>
<rect x="112" y="140" width="648" height="42" rx="8" fill="#0f2a1f" stroke="#63d4a0" stroke-width="1.3"/>
<text x="142" y="166" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="middle">A</text>
<text x="720" y="166" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="middle">A</text>
<rect x="400" y="140" width="70" height="42" rx="6" fill="#0d1117" stroke="#ff8a80" stroke-width="1.5" stroke-dasharray="5 4"/>
<g transform="translate(427 153) scale(0.666667)" fill="none" stroke="#ff8a80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="4" height="14" rx="1" fill="#ff8a80"/><rect x="14" y="5" width="4" height="14" rx="1" fill="#ff8a80"/></g>
<text x="98" y="214" font-size="13" fill="#9ba7b3" text-anchor="end">CPU 1</text>
<rect x="112" y="188" width="648" height="42" rx="8" fill="#3a2a12" stroke="#f0a650" stroke-width="1.3"/>
<text x="142" y="214" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="middle">X</text>
<text x="720" y="214" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="middle">X</text>
<rect x="400" y="188" width="70" height="42" rx="6" fill="#0d1117" stroke="#ff8a80" stroke-width="1.5" stroke-dasharray="5 4"/>
<g transform="translate(427 201) scale(0.666667)" fill="none" stroke="#ff8a80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="4" height="14" rx="1" fill="#ff8a80"/><rect x="14" y="5" width="4" height="14" rx="1" fill="#ff8a80"/></g>
<text x="98" y="262" font-size="13" fill="#9ba7b3" text-anchor="end">CPU 2</text>
<rect x="112" y="236" width="448" height="42" rx="8" fill="#0f2440" stroke="#3f7dc4" stroke-width="1.3"/>
<text x="142" y="262" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="middle">B</text>
<text x="520" y="262" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="middle">B</text>
<rect x="560" y="236" width="200" height="42" rx="8" fill="#0f2a1f" stroke="#63d4a0" stroke-width="1.3"/>
<text x="590" y="262" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="middle">A</text>
<rect x="400" y="236" width="70" height="42" rx="6" fill="#0d1117" stroke="#ff8a80" stroke-width="1.5" stroke-dasharray="5 4"/>
<g transform="translate(427 249) scale(0.666667)" fill="none" stroke="#ff8a80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="4" height="14" rx="1" fill="#ff8a80"/><rect x="14" y="5" width="4" height="14" rx="1" fill="#ff8a80"/></g>
<text x="98" y="310" font-size="13" fill="#9ba7b3" text-anchor="end">CPU 3</text>
<rect x="112" y="284" width="648" height="42" rx="8" fill="#3a2a12" stroke="#f0a650" stroke-width="1.3"/>
<text x="142" y="310" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="middle">X</text>
<text x="720" y="310" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="middle">X</text>
<rect x="400" y="284" width="70" height="42" rx="6" fill="#0d1117" stroke="#ff8a80" stroke-width="1.5" stroke-dasharray="5 4"/>
<g transform="translate(427 297) scale(0.666667)" fill="none" stroke="#ff8a80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="4" height="14" rx="1" fill="#ff8a80"/><rect x="14" y="5" width="4" height="14" rx="1" fill="#ff8a80"/></g>
<text x="760" y="124" font-size="12.5" fill="#ff8a80" font-weight="700" text-anchor="end">A and B wait too</text>
<text x="24" y="366" font-size="15" fill="#63d4a0" font-weight="700">Now: only the CPUs running X stop</text>
<text x="98" y="408" font-size="13" fill="#9ba7b3" text-anchor="end">CPU 0</text>
<rect x="112" y="382" width="648" height="42" rx="8" fill="#0f2a1f" stroke="#63d4a0" stroke-width="1.3"/>
<text x="142" y="408" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="middle">A</text>
<text x="720" y="408" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="middle">A</text>
<text x="98" y="456" font-size="13" fill="#9ba7b3" text-anchor="end">CPU 1</text>
<rect x="112" y="430" width="648" height="42" rx="8" fill="#3a2a12" stroke="#f0a650" stroke-width="1.3"/>
<text x="142" y="456" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="middle">X</text>
<text x="720" y="456" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="middle">X</text>
<rect x="400" y="430" width="70" height="42" rx="6" fill="#0d1117" stroke="#ff8a80" stroke-width="1.5" stroke-dasharray="5 4"/>
<g transform="translate(427 443) scale(0.666667)" fill="none" stroke="#ff8a80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="4" height="14" rx="1" fill="#ff8a80"/><rect x="14" y="5" width="4" height="14" rx="1" fill="#ff8a80"/></g>
<text x="98" y="504" font-size="13" fill="#9ba7b3" text-anchor="end">CPU 2</text>
<rect x="112" y="478" width="448" height="42" rx="8" fill="#0f2440" stroke="#3f7dc4" stroke-width="1.3"/>
<text x="142" y="504" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="middle">B</text>
<text x="520" y="504" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="middle">B</text>
<rect x="560" y="478" width="200" height="42" rx="8" fill="#0f2a1f" stroke="#63d4a0" stroke-width="1.3"/>
<text x="590" y="504" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="middle">A</text>
<text x="98" y="552" font-size="13" fill="#9ba7b3" text-anchor="end">CPU 3</text>
<rect x="112" y="526" width="648" height="42" rx="8" fill="#3a2a12" stroke="#f0a650" stroke-width="1.3"/>
<text x="142" y="552" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="middle">X</text>
<text x="720" y="552" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="middle">X</text>
<rect x="400" y="526" width="70" height="42" rx="6" fill="#0d1117" stroke="#ff8a80" stroke-width="1.5" stroke-dasharray="5 4"/>
<g transform="translate(427 539) scale(0.666667)" fill="none" stroke="#ff8a80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="4" height="14" rx="1" fill="#ff8a80"/><rect x="14" y="5" width="4" height="14" rx="1" fill="#ff8a80"/></g>
<text x="760" y="366" font-size="12.5" fill="#63d4a0" font-weight="700" text-anchor="end">A and B keep running</text>
<line x1="112" y1="590" x2="760" y2="590" stroke="#8b98a5" stroke-width="1.5"/>
<text x="760" y="610" font-size="12.5" fill="#9ba7b3" text-anchor="end">time →</text>
</svg>
