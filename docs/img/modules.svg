<text x="674" y="146" font-size="13.5" fill="#0e2a20" font-weight="700">Catalogue</text>
<text x="646" y="172" font-size="12" fill="#4b5c55">signed snapshot</text>
<text x="646" y="190" font-size="12" fill="#4b5c55">files + manifest</text>
<line x1="24" y1="226" x2="776" y2="226" stroke="#858f8a" stroke-width="1"/>
<text x="24" y="254" font-size="14" fill="#4b5c55" font-weight="700">Using a module: templates from the catalogue, then a child cell</text>
