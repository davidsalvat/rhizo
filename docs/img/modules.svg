<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Designed: modular cells</title>
<desc>Designed, not built yet. Supply: a builder cell in its own domain installs packages only through rhizo proxy on the host, which serves only the files the lockfile names, checks each pinned SHA-256, takes a token per build and logs every request; the operator reviews and signs the result into a signed catalogue of templates. Use: templates form a tree that shares memory (python, python plus numpy, plus pandas; node). An agent asks to add numpy; the kernel checks the whitelist, budget and egress, asks the parent for sensitive modules, and forks a child from the warm template, reached over a channel. Adding a module, even the requests library, never grants network access.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#57706a"/></marker><marker id="g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f9d6b"/></marker><marker id="b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a5cc2"/></marker><marker id="o" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a6100"/></marker><marker id="r" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b42318"/></marker><marker id="c" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#146c4a"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="799" height="559" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="40" font-size="20" fill="#0e2a20" font-weight="700">Next: abilities as child cells, from a signed catalogue</text>
<rect x="577.8" y="20" width="198.20000000000002" height="42" rx="21" fill="#fff4d6" stroke="#875a00" stroke-width="1.2"/>
<text x="676.9" y="46" font-size="12.5" fill="#875a00" font-weight="700" text-anchor="middle">designed, not built yet</text>
<text x="24" y="104" font-size="14" fill="#4b5c55" font-weight="700">Building a module</text>
<rect x="24" y="116" width="140" height="90" rx="12" fill="#f3f5f4" stroke="#858f8a" stroke-width="1.3"/>
<g transform="translate(38 131) scale(0.833333)" fill="none" stroke="#0e2a20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></g>
<text x="66" y="146" font-size="13.5" fill="#0e2a20" font-weight="700">Packages</text>
<text x="38" y="172" font-size="12" fill="#4b5c55">from PyPI, over</text>
<text x="38" y="190" font-size="12" fill="#4b5c55">verified TLS</text>
<line x1="164" y1="161" x2="176" y2="161" stroke="#57706a" stroke-width="2" marker-end="url(#a)"/>
<rect x="176" y="116" width="140" height="90" rx="12" fill="#f3f5f4" stroke="#858f8a" stroke-width="1.3"/>
<g transform="translate(190 131) scale(0.833333)" fill="none" stroke="#0e2a20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g>
<text x="218" y="146" font-size="13.5" fill="#0e2a20" font-weight="700">rhizo proxy</text>
<text x="190" y="172" font-size="12" fill="#4b5c55">lockfile files only,</text>
<text x="190" y="190" font-size="12" fill="#4b5c55">SHA-256 checked</text>
