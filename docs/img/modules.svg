<g transform="translate(54 415) scale(0.666667)" fill="none" stroke="#146c4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/><path d="M9.5 3.5L12 6l2.5-2.5M9.5 20.5L12 18l2.5 2.5"/></g>
<text x="78" y="428" font-size="13.5" fill="#0e2a20" font-weight="700">+ pandas</text>
<rect x="210" y="270" width="120" height="42" rx="14" fill="#eafaf2" stroke="#1f9d6b" stroke-width="1.8"/>
<g transform="translate(224 283) scale(0.666667)" fill="none" stroke="#146c4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/><path d="M9.5 3.5L12 6l2.5-2.5M9.5 20.5L12 18l2.5 2.5"/></g>
<text x="248" y="296" font-size="13.5" fill="#0e2a20" font-weight="700">node</text>
<line x1="44" y1="312" x2="44" y2="336" stroke="#57706a" stroke-width="2" marker-end="url(#a)"/>
<line x1="60" y1="378" x2="60" y2="402" stroke="#57706a" stroke-width="2" marker-end="url(#a)"/>
<text x="24" y="470" font-size="12.5" fill="#4b5c55">templates share memory</text>
