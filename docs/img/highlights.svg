<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 536" width="800" height="536" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>The numbers that matter</title>
<desc>Six headline figures from one benchmark run. Node.js, ready to answer, forked from a warm template: 3.60 ms (warm fork 3.60 ms, cold start 31.31 ms); with its JIT, cold is 22% faster. numpy from PyPI wheels, forked after import numpy: 12.02 ms (Rhizo cell 12.02 ms, Linux process 16.68 ms); cold: cell 61.55 ms, Linux 71.11 ms. 50 agents on a laptop, 45 of them suspended: 6.6 MB (shared snapshots 6.6 MB, full copies (before) 60 MB); snapshots point at shared pages. A template saved to a file, loaded into a fresh VM: 3.4× sooner (loaded template 10.88 ms, cold agent 37.26 ms); to its first answer (QEMU). Host operation on one cell, how long other cells stall: 19 µs (now 19 µs, every CPU stopped 106 µs); 6× shorter. 10,000 busy cells, 1 vCPU, 99th percentile wait to wake: 0.6–3.1 ms; 39k–46k operations/s.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#57706a"/></marker><marker id="g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f9d6b"/></marker><marker id="b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a5cc2"/></marker><marker id="o" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a6100"/></marker><marker id="r" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b42318"/></marker><marker id="c" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#146c4a"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="799" height="535" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="40" font-size="20" fill="#0e2a20" font-weight="700">The numbers that matter</text>
<text x="24" y="64" font-size="14" fill="#4b5c55">Medians from one CI run with KVM (Firecracker unless noted); bars to scale within each card</text>
<rect x="24" y="84" width="240" height="196" rx="14" fill="#f3f5f4" stroke="#858f8a" stroke-width="1.5"/>
<text x="40" y="110" font-size="14.5" fill="#0e2a20" font-weight="700">Node.js, ready to answer</text>
<text x="40" y="129" font-size="12.5" fill="#4b5c55">forked from a warm template</text>
<text x="40" y="168" font-size="28" fill="#146c4a" font-weight="700">3.60 ms</text>
<text x="40" y="196" font-size="12.5" fill="#0e2a20">warm fork</text>
<text x="248" y="196" font-size="12.5" fill="#0e2a20" font-weight="700" text-anchor="end">3.60 ms</text>
<rect x="40" y="202" width="23.9" height="10" rx="3" fill="#1f9d6b" stroke="#1f9d6b" stroke-width="0"/>
<text x="40" y="228" font-size="12.5" fill="#4b5c55">cold start</text>
<text x="248" y="228" font-size="12.5" fill="#4b5c55" text-anchor="end">31.31 ms</text>
<rect x="40" y="234" width="208.0" height="10" rx="3" fill="#77818b" stroke="#77818b" stroke-width="0"/>
<text x="40" y="264" font-size="12.5" fill="#146c4a" font-weight="700">with its JIT, cold is 22% faster</text>
<rect x="280" y="84" width="240" height="196" rx="14" fill="#f3f5f4" stroke="#858f8a" stroke-width="1.5"/>
<text x="296" y="110" font-size="14.5" fill="#0e2a20" font-weight="700">numpy from PyPI wheels</text>
<text x="296" y="129" font-size="12.5" fill="#4b5c55">forked after import numpy</text>
<text x="296" y="168" font-size="28" fill="#146c4a" font-weight="700">12.02 ms</text>
<text x="296" y="196" font-size="12.5" fill="#0e2a20">Rhizo cell</text>
<text x="504" y="196" font-size="12.5" fill="#0e2a20" font-weight="700" text-anchor="end">12.02 ms</text>
<rect x="296" y="202" width="149.9" height="10" rx="3" fill="#1f9d6b" stroke="#1f9d6b" stroke-width="0"/>
<text x="296" y="228" font-size="12.5" fill="#4b5c55">Linux process</text>
<text x="504" y="228" font-size="12.5" fill="#4b5c55" text-anchor="end">16.68 ms</text>
<rect x="296" y="234" width="208.0" height="10" rx="3" fill="#77818b" stroke="#77818b" stroke-width="0"/>
<text x="296" y="264" font-size="12.5" fill="#146c4a" font-weight="700">cold: cell 61.55 ms, Linux 71.11 ms</text>
<rect x="536" y="84" width="240" height="196" rx="14" fill="#f3f5f4" stroke="#858f8a" stroke-width="1.5"/>
<text x="552" y="110" font-size="14.5" fill="#0e2a20" font-weight="700">50 agents on a laptop</text>
<text x="552" y="129" font-size="12.5" fill="#4b5c55">45 of them suspended</text>
<text x="552" y="168" font-size="28" fill="#146c4a" font-weight="700">6.6 MB</text>
<text x="552" y="196" font-size="12.5" fill="#0e2a20">shared snapshots</text>
<text x="760" y="196" font-size="12.5" fill="#0e2a20" font-weight="700" text-anchor="end">6.6 MB</text>
<rect x="552" y="202" width="22.7" height="10" rx="3" fill="#1f9d6b" stroke="#1f9d6b" stroke-width="0"/>
<text x="552" y="228" font-size="12.5" fill="#4b5c55">full copies (before)</text>
<text x="760" y="228" font-size="12.5" fill="#4b5c55" text-anchor="end">60 MB</text>
<rect x="552" y="234" width="208.0" height="10" rx="3" fill="#77818b" stroke="#77818b" stroke-width="0"/>
<text x="552" y="264" font-size="12.5" fill="#146c4a" font-weight="700">snapshots point at shared pages</text>
<rect x="24" y="296" width="240" height="196" rx="14" fill="#f3f5f4" stroke="#858f8a" stroke-width="1.5"/>
<text x="40" y="322" font-size="14.5" fill="#0e2a20" font-weight="700">A template saved to a file</text>
<text x="40" y="341" font-size="12.5" fill="#4b5c55">loaded into a fresh VM</text>
<text x="40" y="380" font-size="28" fill="#146c4a" font-weight="700">3.4× sooner</text>
<text x="40" y="408" font-size="12.5" fill="#0e2a20">loaded template</text>
<text x="248" y="408" font-size="12.5" fill="#0e2a20" font-weight="700" text-anchor="end">10.88 ms</text>
<rect x="40" y="414" width="60.7" height="10" rx="3" fill="#1f9d6b" stroke="#1f9d6b" stroke-width="0"/>
<text x="40" y="440" font-size="12.5" fill="#4b5c55">cold agent</text>
<text x="248" y="440" font-size="12.5" fill="#4b5c55" text-anchor="end">37.26 ms</text>
<rect x="40" y="446" width="208.0" height="10" rx="3" fill="#77818b" stroke="#77818b" stroke-width="0"/>
<text x="40" y="476" font-size="12.5" fill="#146c4a" font-weight="700">to its first answer (QEMU)</text>
<rect x="280" y="296" width="240" height="196" rx="14" fill="#f3f5f4" stroke="#858f8a" stroke-width="1.5"/>
<text x="296" y="322" font-size="14.5" fill="#0e2a20" font-weight="700">Host operation on one cell</text>
<text x="296" y="341" font-size="12.5" fill="#4b5c55">how long other cells stall</text>
<text x="296" y="380" font-size="28" fill="#146c4a" font-weight="700">19 µs</text>
<text x="296" y="408" font-size="12.5" fill="#0e2a20">now</text>
<text x="504" y="408" font-size="12.5" fill="#0e2a20" font-weight="700" text-anchor="end">19 µs</text>
<rect x="296" y="414" width="36.8" height="10" rx="3" fill="#1f9d6b" stroke="#1f9d6b" stroke-width="0"/>
<text x="296" y="440" font-size="12.5" fill="#4b5c55">every CPU stopped</text>
<text x="504" y="440" font-size="12.5" fill="#4b5c55" text-anchor="end">106 µs</text>
<rect x="296" y="446" width="208.0" height="10" rx="3" fill="#77818b" stroke="#77818b" stroke-width="0"/>
<text x="296" y="476" font-size="12.5" fill="#146c4a" font-weight="700">6× shorter</text>
<rect x="536" y="296" width="240" height="196" rx="14" fill="#f3f5f4" stroke="#858f8a" stroke-width="1.5"/>
<text x="552" y="322" font-size="14.5" fill="#0e2a20" font-weight="700">10,000 busy cells, 1 vCPU</text>
<text x="552" y="341" font-size="12.5" fill="#4b5c55">99th percentile wait to wake</text>
<text x="552" y="380" font-size="28" fill="#146c4a" font-weight="700">0.6–3.1 ms</text>
<text x="552" y="412" font-size="12.5" fill="#4b5c55">range over four VMMs,</text>
<text x="552" y="432" font-size="12.5" fill="#4b5c55">the slowest: Firecracker</text>
<text x="552" y="476" font-size="12.5" fill="#146c4a" font-weight="700">39k–46k operations/s</text>
<text x="24" y="518" font-size="12.5" fill="#4b5c55">Shared runners are noisy: figures move between runs. The tables hold every value.</text>
</svg>
