<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 412" width="800" height="412" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Both architectures, in instructions</title>
<desc>Bar chart of retired instructions per operation under QEMU -icount, lower is better, bars to scale within each operation. Switch between two cells: x86_64 875, AArch64 817. Run hello, start to exit: x86_64 88,401, AArch64 94,336. Fork a 50 MiB cell: x86_64 7,010, AArch64 7,696. glibc program, warm: x86_64 76,819, AArch64 73,792.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b98a5"/></marker><marker id="g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#63d4a0"/></marker><marker id="b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#79b8ff"/></marker><marker id="o" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2c14e"/></marker><marker id="r" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff8a80"/></marker><marker id="c" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#63d4a0"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="799" height="411" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="24" y="40" font-size="20" fill="#e6edf3" font-weight="700">Both architectures, in instructions</text>
<text x="24" y="64" font-size="14" fill="#9ba7b3">Retired instructions per operation under QEMU -icount; bars to scale within each operation</text>
<rect x="24" y="78" width="14" height="14" rx="3" fill="#63d4a0" stroke="#63d4a0" stroke-width="0"/>
<text x="44" y="90" font-size="14" fill="#e6edf3">AArch64 (virt)</text>
<rect x="160" y="78" width="14" height="14" rx="3" fill="#768390" stroke="#768390" stroke-width="0"/>
<text x="180" y="90" font-size="14" fill="#e6edf3">x86_64 (microvm)</text>
<text x="218" y="134" font-size="15" fill="#e6edf3" font-weight="700" text-anchor="end">Switch between two cells</text>
<rect x="230" y="112" width="392.2" height="18" rx="3" fill="#63d4a0" stroke="#63d4a0" stroke-width="0"/>
<text x="630.2" y="126" font-size="14" fill="#e6edf3" font-weight="700">817</text>
<rect x="230" y="136" width="420.0" height="18" rx="3" fill="#768390" stroke="#768390" stroke-width="0"/>
<text x="658.0" y="150" font-size="14" fill="#e6edf3">875</text>
<text x="218" y="198" font-size="15" fill="#e6edf3" font-weight="700" text-anchor="end">Run hello, start to exit</text>
<rect x="230" y="176" width="420.0" height="18" rx="3" fill="#63d4a0" stroke="#63d4a0" stroke-width="0"/>
<text x="658.0" y="190" font-size="14" fill="#e6edf3" font-weight="700">94,336</text>
<rect x="230" y="200" width="393.6" height="18" rx="3" fill="#768390" stroke="#768390" stroke-width="0"/>
<text x="631.6" y="214" font-size="14" fill="#e6edf3">88,401</text>
<text x="218" y="262" font-size="15" fill="#e6edf3" font-weight="700" text-anchor="end">Fork a 50 MiB cell</text>
<rect x="230" y="240" width="420.0" height="18" rx="3" fill="#63d4a0" stroke="#63d4a0" stroke-width="0"/>
<text x="658.0" y="254" font-size="14" fill="#e6edf3" font-weight="700">7,696</text>
<rect x="230" y="264" width="382.6" height="18" rx="3" fill="#768390" stroke="#768390" stroke-width="0"/>
<text x="620.6" y="278" font-size="14" fill="#e6edf3">7,010</text>
<text x="218" y="326" font-size="15" fill="#e6edf3" font-weight="700" text-anchor="end">glibc program, warm</text>
<rect x="230" y="304" width="403.5" height="18" rx="3" fill="#63d4a0" stroke="#63d4a0" stroke-width="0"/>
<text x="641.5" y="318" font-size="14" fill="#e6edf3" font-weight="700">73,792</text>
<rect x="230" y="328" width="420.0" height="18" rx="3" fill="#768390" stroke="#768390" stroke-width="0"/>
<text x="658.0" y="342" font-size="14" fill="#e6edf3">76,819</text>
<text x="24" y="390" font-size="13" fill="#9ba7b3">Exact counts: the same on every run and host. GitHub's ARM64 runners have no KVM, so no AArch64 timings.</text>
</svg>
