<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Thesis targets and where they stand</title>
<desc>Fork a 50 MB cell: target under 1 ms, measured 1.1 to 1.3 µs, met. Resume from memory: target under 100 µs, measured 0.7 to 1.1 µs with lazy restore, met. Overhead per idle cell: target a few KB, being measured in H9, in progress.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57706a"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="799" height="249" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<rect x="24" y="24" width="240" height="202" rx="12" fill="#eafaf2" stroke="#1f9d6b" stroke-width="1.5"/>
<text x="42" y="56" font-size="16" fill="#0e2a20" font-weight="700">Fork a ~50 MB cell</text>
<text x="42" y="80" font-size="14" fill="#4b5c55">target &lt; 1 ms</text>
<text x="42" y="134" font-size="30" fill="#146c4a" font-weight="700">1.4–1.5 µs</text>
<text x="42" y="160" font-size="14" fill="#4b5c55">copy-on-write</text>
<rect x="42" y="180" width="74" height="28" rx="14" fill="#16784f" stroke="#16784f" stroke-width="0"/>
<text x="79" y="199" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">✓ Met</text>
<rect x="280" y="24" width="240" height="202" rx="12" fill="#eafaf2" stroke="#1f9d6b" stroke-width="1.5"/>
<text x="298" y="56" font-size="16" fill="#0e2a20" font-weight="700">Resume from memory</text>
<text x="298" y="80" font-size="14" fill="#4b5c55">target &lt; 100 µs</text>
<text x="298" y="134" font-size="30" fill="#146c4a" font-weight="700">1.2–1.3 µs</text>
<text x="298" y="160" font-size="14" fill="#4b5c55">lazy restore</text>
<rect x="298" y="180" width="74" height="28" rx="14" fill="#16784f" stroke="#16784f" stroke-width="0"/>
<text x="335" y="199" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">✓ Met</text>
<rect x="536" y="24" width="240" height="202" rx="12" fill="#f3f5f4" stroke="#c3ccc8" stroke-width="1.5"/>
<text x="554" y="56" font-size="16" fill="#0e2a20" font-weight="700">Idle cell overhead</text>
<text x="554" y="80" font-size="14" fill="#4b5c55">target: a few KB</text>
<text x="554" y="134" font-size="30" fill="#0e2a20" font-weight="700">Measuring</text>
<text x="554" y="160" font-size="14" fill="#4b5c55">milestone H9</text>
<rect x="554" y="180" width="112" height="28" rx="14" fill="#fff4d6" stroke="#875a00" stroke-width="1.5"/>
<text x="610" y="199" font-size="14" fill="#875a00" font-weight="700" text-anchor="middle">In progress</text>
</svg>
