<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Two markets, one engine</title>
<desc>Servers (B2B): density, cost per agent, an API. Local AI (B2C): an app, downloadable templates, your own model. Both products are planned; they run on the same engine, the Rhizo kernel and its agent cells, which is built today.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b98a5"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="799" height="339" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="24" y="40" font-size="20" fill="#e6edf3" font-weight="700">Two markets, one engine</text>
<rect x="24" y="64" width="364" height="140" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="44" y="94" font-size="17" fill="#e6edf3" font-weight="700">Servers (B2B)</text>
<text x="372" y="94" font-size="12" fill="#9ba7b3" font-weight="700" text-anchor="end">planned</text>
<text x="44" y="124" font-size="14" fill="#9ba7b3">· many agents per machine</text>
<text x="44" y="148" font-size="14" fill="#9ba7b3">· low cost per agent</text>
<text x="44" y="172" font-size="14" fill="#9ba7b3">· an API to create, fork, resume</text>
<line x1="206" y1="204" x2="206" y2="236" stroke="#8b98a5" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="412" y="64" width="364" height="140" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="432" y="94" font-size="17" fill="#e6edf3" font-weight="700">Your computer (B2C)</text>
<text x="760" y="94" font-size="12" fill="#9ba7b3" font-weight="700" text-anchor="end">planned</text>
<text x="432" y="124" font-size="14" fill="#9ba7b3">· a two-click app</text>
<text x="432" y="148" font-size="14" fill="#9ba7b3">· downloadable templates</text>
<text x="432" y="172" font-size="14" fill="#9ba7b3">· your own local model</text>
<line x1="594" y1="204" x2="594" y2="236" stroke="#8b98a5" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="24" y="238" width="752" height="68" rx="20" fill="#0f2a1f" stroke="#63d4a0" stroke-width="2"/>
<text x="400" y="268" font-size="17" fill="#e6edf3" font-weight="700" text-anchor="middle">One engine: the Rhizo kernel and its agent cells</text>
<text x="400" y="291" font-size="14" fill="#9ba7b3" text-anchor="middle">density, security and compatibility serve both</text>
<text x="24" y="322" font-size="13" fill="#9ba7b3">Solid: built today. Dashed: planned.</text>
</svg>
