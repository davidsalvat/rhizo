<rect class="bg" x="0.5" y="0.5" width="359" height="189" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<g transform="translate(26 40) scale(1.66667)" fill="none" stroke="#0e2a20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6M10 2v6L4.5 19a2 2 0 0 0 1.8 3h11.4a2 2 0 0 0 1.8-3L14 8V2"/><path d="M7 15h10"/></g>
<line x1="36" y1="120" x2="330" y2="120" stroke="#858f8a" stroke-width="2"/>
<circle cx="100" cy="120" r="7" fill="#1f9d6b" stroke="none" stroke-width="1.5"/>
<circle cx="170" cy="120" r="7" fill="#8a6100" stroke="none" stroke-width="1.5"/>
<circle cx="240" cy="120" r="7" fill="#1f9d6b" stroke="none" stroke-width="1.5"/>
<circle cx="300" cy="120" r="7" fill="#1f9d6b" stroke="none" stroke-width="1.5"/>
<g transform="translate(140 88) scale(0.833333)" fill="none" stroke="#8a6100" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22V3"/><path d="M5 4h12l-2.5 4L17 12H5"/></g>
