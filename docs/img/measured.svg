<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1742" width="800" height="1742" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Measured on the same machine</title>
<desc>Bar chart, lower is better, bars to scale within each comparison. Same operation, same kind of VM: a cell against a Linux process. Fork, holding 50 MiB (the fork call): Rhizo cell 1.78 µs, Linux fork() 256 µs. Fork, then the child writes all 50 MiB: Rhizo cell 3.03 ms, Linux fork + write 30.62 ms. Run hello, from start to exit: Rhizo cell 10 µs, Linux posix_spawn 517 µs. Resume a suspended 8 MiB program: Cell, lazy 0.79 µs, Cell, eager 236 µs, Cell, lazy + read all 232 µs, CRIU restore (host) 4.62 ms. CPython agent request, cold start: Rhizo cell 17.68 ms, Linux process 21.36 ms. CPython agent request, from a warm template: Rhizo cell 3.38 ms, Linux fork of warm 5.95 ms. numpy from PyPI wheels, cold start: Rhizo cell 61.55 ms, Linux process 71.11 ms. numpy from PyPI wheels, from a warm template: Rhizo cell 12.02 ms, Linux fork of warm 16.68 ms. Node.js agent request (Linux cannot fork Node.js): Cell, warm template 3.60 ms, Cell, cold 31.31 ms, Linux process, cold 39.63 ms. Answer a Python request (MicroPython): Warm template 437 µs, Cold interpreter 3.54 ms. Whole VMs and sandboxes: a larger scope, shown for scale. Resume a whole environment: Cell, eager 236 µs, Firecracker VM 4.70 ms, gVisor sandbox 103.64 ms. Run hello in a new environment: Rhizo cell 10 µs, gVisor sandbox 76.74 ms.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#57706a"/></marker><marker id="g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f9d6b"/></marker><marker id="b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a5cc2"/></marker><marker id="o" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a6100"/></marker><marker id="r" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b42318"/></marker><marker id="c" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#146c4a"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="799" height="1741" rx="12" fill="#ffffff" stroke="#d0d7de"/>
