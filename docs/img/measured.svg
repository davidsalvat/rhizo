<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1180" width="800" height="1180" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Measured on the same machine</title>
<desc>Log-scale bar chart, lower is better. Same operation, same kind of VM: a cell against a Linux process. Fork, holding 50 MiB (the fork call): Rhizo cell 0.92 µs, Linux fork() 87 µs. Fork, then the child writes all 50 MiB: Rhizo cell 5.55 ms, Linux fork + write 23.61 ms. Run hello, from start to exit: Rhizo cell 7.18 µs, Linux posix_spawn 595 µs. Resume a suspended 8 MiB program: Cell, lazy 0.94 µs, Cell, eager 601 µs, Cell, lazy + read all 624 µs, CRIU restore (host) 2.51 ms. Answer a Python request (MicroPython): Warm template 471 µs, Cold interpreter 3.56 ms. Whole VMs and sandboxes: a larger scope, shown for scale. Resume a whole environment: Cell, eager 601 µs, Firecracker VM 3.74 ms, gVisor sandbox 93.65 ms. Run hello in a new environment: Rhizo cell 7.18 µs, gVisor sandbox 72.15 ms.</desc>
