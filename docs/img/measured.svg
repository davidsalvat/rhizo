<text x="291.77888656808136" y="312" font-size="14" fill="#0e2a20" font-weight="700" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">3.80 ms</text>
<text x="190" y="343" font-size="14" fill="#4b5c55" text-anchor="end">Linux fork + write</text>
<rect x="200" y="329" width="476.0" height="20" rx="3" fill="#77818b" stroke="#77818b" stroke-width="0"/>
