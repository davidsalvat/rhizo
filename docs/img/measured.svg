<text x="24" y="1684" font-size="14" fill="#4b5c55">GitHub-hosted runners with KVM (shared machines, nested virtualization). Rhizo and</text>
<text x="24" y="1703" font-size="14" fill="#4b5c55">the Linux processes run inside Firecracker; CRIU runs on the host. Eager resume restores</text>
<text x="24" y="1722" font-size="14" fill="#4b5c55">every page first; lazy brings pages back on first touch.</text>
