<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1742" width="800" height="1742" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Measured on the same machine</title>
<desc>Bar chart, lower is better, bars to scale within each comparison. Same operation, same kind of VM: a cell against a Linux process. Fork, holding 50 MiB (the fork call): Rhizo cell 1.91 µs, Linux fork() 255 µs. Fork, then the child writes all 50 MiB: Rhizo cell 3.31 ms, Linux fork + write 30.64 ms. Run hello, from start to exit: Rhizo cell 10 µs, Linux posix_spawn 513 µs. Resume a suspended 8 MiB program: Cell, lazy 0.88 µs, Cell, eager 237 µs, Cell, lazy + read all 247 µs, CRIU restore (host) 4.65 ms. CPython agent request, cold start: Rhizo cell 17.85 ms, Linux process 21.37 ms. CPython agent request, from a warm template: Rhizo cell 3.65 ms, Linux fork of warm 6.03 ms. numpy from PyPI wheels, cold start: Rhizo cell 67.55 ms, Linux process 70.51 ms. numpy from PyPI wheels, from a warm template: Rhizo cell 13.89 ms, Linux fork of warm 16.07 ms. Node.js agent request (Linux cannot fork Node.js): Cell, warm template 4.11 ms, Cell, cold 34.32 ms, Linux process, cold 40.57 ms. Answer a Python request (MicroPython): Warm template 443 µs, Cold interpreter 3.59 ms. Whole VMs and sandboxes: a larger scope, shown for scale. Resume a whole environment: Cell, eager 237 µs, Firecracker VM 3.71 ms, gVisor sandbox 104.81 ms. Run hello in a new environment: Rhizo cell 10 µs, gVisor sandbox 75.46 ms.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57706a"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="799" height="1741" rx="12" fill="#ffffff" stroke="#d0d7de"/>
