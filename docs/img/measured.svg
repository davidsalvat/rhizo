<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1742" width="800" height="1742" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Measured on the same machine</title>
<desc>Bar chart, lower is better, bars to scale within each comparison. Same operation, same kind of VM: a cell against a Linux process. Fork, holding 50 MiB (the fork call): Rhizo cell 2.69 µs, Linux fork() 84 µs. Fork, then the child writes all 50 MiB: Rhizo cell 7.46 ms, Linux fork + write 28.03 ms. Run hello, from start to exit: Rhizo cell 6.21 µs, Linux posix_spawn 564 µs. Resume a suspended 8 MiB program: Cell, lazy 1.33 µs, Cell, eager 600 µs, Cell, lazy + read all 635 µs, CRIU restore (host) 4.06 ms. CPython agent request, cold start: Rhizo cell 18.41 ms, Linux process 18.35 ms. CPython agent request, from a warm template: Rhizo cell 4.06 ms, Linux fork of warm 5.57 ms. numpy from PyPI wheels, cold start: Rhizo cell 78.13 ms, Linux process 65.65 ms. numpy from PyPI wheels, from a warm template: Rhizo cell 19.00 ms, Linux fork of warm 18.33 ms. Node.js agent request (Linux cannot fork Node.js): Cell, warm template 8.30 ms, Cell, cold 50.16 ms, Linux process, cold 44.25 ms. Answer a Python request (MicroPython): Warm template 509 µs, Cold interpreter 3.45 ms. Whole VMs and sandboxes: a larger scope, shown for scale. Resume a whole environment: Cell, eager 600 µs, Firecracker VM 3.55 ms, gVisor sandbox 102.79 ms. Run hello in a new environment: Rhizo cell 6.21 µs, gVisor sandbox 74.63 ms.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#57706a"/></marker><marker id="g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f9d6b"/></marker><marker id="b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a5cc2"/></marker><marker id="o" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a6100"/></marker><marker id="r" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b42318"/></marker><marker id="c" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#146c4a"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="799" height="1741" rx="12" fill="#ffffff" stroke="#d0d7de"/>
