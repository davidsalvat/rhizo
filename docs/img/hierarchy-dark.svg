<text x="24" y="474" font-size="13" fill="#e6edf3" font-weight="700">No shared loopback, files or counters</text>
<text x="24" y="493" font-size="12" fill="#9ba7b3">storage channels closed</text>
<text x="278" y="474" font-size="13" fill="#e6edf3" font-weight="700">Egress checked on every socket</text>
<text x="278" y="493" font-size="12" fill="#9ba7b3">inherited, only narrowed; default: none</text>
<text x="532" y="474" font-size="13" fill="#e6edf3" font-weight="700">Handles with rights that only shrink</text>
<text x="532" y="493" font-size="12" fill="#9ba7b3">cells, channels, views; revocable</text>
<text x="24" y="536" font-size="12.5" fill="#9ba7b3">Timing channels on shared CPUs remain: listed and measured, and reduced further with exclusive CPU sets.</text>
