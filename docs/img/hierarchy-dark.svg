<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Being built: the cell hierarchy</title>
<desc>Being built: the tree, its domains, budgets, egress policies, CPU shares by weight and the audit log are in; channels and handles come next. The host is the root; each of its children roots a domain. Agent A, with egress to the model only and a budget of 1 GiB and 8 cells, has two children with no egress: tools, reached over a channel, and a python module. Agent B has an allowlist egress policy and a worker child. Authority flows down. Between domains nothing is shared: no loopback, no files, no counters; only slow timing channels remain, measured. Handles carry rights that can only shrink.</desc>
