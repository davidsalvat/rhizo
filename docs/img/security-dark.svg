<g transform="translate(538 512) scale(0.833333)" fill="none" stroke="#e3b341" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></g>
<text x="568" y="519" font-size="14" fill="#e3b341" font-weight="700">External audit</text>
<text x="568" y="538" font-size="12.5" fill="#9ba7b3">scoped, not done yet</text>
<text x="24" y="568" font-size="12.5" fill="#9ba7b3">Details: docs/security.md (threat model, findings), docs/audit-scope.md (what an auditor gets).</text>
</svg>
