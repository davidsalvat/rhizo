<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 586" width="800" height="586" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Security: trust boundaries and defences</title>
<desc>Everything that reaches the Rhizo kernel from cells, snapshot files and the network is untrusted: hostile cells, hostile snapshot files and hostile network frames. The host's control requests are trusted but decoded defensively; the VMM and hardware are trusted. The kernel defends with privilege levels and own address spaces, quotas, KPTI and E0PD, SMEP, SMAP and PAN, write-or-execute pages, and zeroed memory. Three internal reviews fixed or worked around 23 findings and fuzzers keep them fixed; an external audit is scoped but not done yet.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b98a5"/></marker><marker id="g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#63d4a0"/></marker><marker id="b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#79b8ff"/></marker><marker id="o" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2c14e"/></marker><marker id="r" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff8a80"/></marker><marker id="c" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#63d4a0"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="799" height="585" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="24" y="40" font-size="20" fill="#e6edf3" font-weight="700">Who is trusted, and what stands in the way</text>
<rect x="24" y="84" width="232" height="64" rx="12" fill="#3a1d1d" stroke="#b5524a" stroke-width="1.5"/>
<g transform="translate(42 104) scale(1)" fill="none" stroke="#ff8a80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="13" rx="4" fill="none"/><path d="M12 7V3.5"/><circle cx="12" cy="3" r="1.3"/><circle cx="9" cy="13" r="1.6" fill="#ff8a80" stroke="none"/><circle cx="15" cy="13" r="1.6" fill="#ff8a80" stroke="none"/><path d="M9.5 17h5"/></g>
<text x="78" y="111" font-size="15" fill="#e6edf3" font-weight="700">Hostile cells</text>
<text x="78" y="131" font-size="12.5" fill="#9ba7b3">any code, any call</text>
<line x1="140" y1="148" x2="140" y2="190" stroke="#ff8a80" stroke-width="2" marker-end="url(#r)"/>
<rect x="284" y="84" width="232" height="64" rx="12" fill="#3a1d1d" stroke="#b5524a" stroke-width="1.5"/>
<g transform="translate(302 104) scale(1)" fill="none" stroke="#ff8a80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h8l4 4v16H6z"/><path d="M14 2v4h4"/></g>
<text x="338" y="111" font-size="15" fill="#e6edf3" font-weight="700">Snapshot files</text>
<text x="338" y="131" font-size="12.5" fill="#9ba7b3">anyone may write one</text>
<line x1="400" y1="148" x2="400" y2="190" stroke="#ff8a80" stroke-width="2" marker-end="url(#r)"/>
<rect x="544" y="84" width="232" height="64" rx="12" fill="#3a1d1d" stroke="#b5524a" stroke-width="1.5"/>
<g transform="translate(562 104) scale(1)" fill="none" stroke="#ff8a80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></g>
<text x="598" y="111" font-size="15" fill="#e6edf3" font-weight="700">Network frames</text>
<text x="598" y="131" font-size="12.5" fill="#9ba7b3">any host on the link</text>
<line x1="660" y1="148" x2="660" y2="190" stroke="#ff8a80" stroke-width="2" marker-end="url(#r)"/>
<text x="776" y="72" font-size="12.5" fill="#ff8a80" font-weight="700" text-anchor="end">untrusted</text>
<rect x="24" y="190" width="752" height="206" rx="16" fill="#0f2a1f" stroke="#63d4a0" stroke-width="2.5"/>
<circle cx="52" cy="220" r="15" fill="#63d4a0" stroke="none" stroke-width="1.5"/>
<g transform="translate(43.375 211.375) scale(0.71875)" fill="none" stroke="#0f2a1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.4 9-8 11-4.6-2-8-6-8-11V5z" fill="none"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g>
<text x="76" y="226" font-size="16" fill="#e6edf3" font-weight="700">Rhizo kernel: every input checked at the boundary</text>
<rect x="44" y="246" width="228" height="62" rx="10" fill="#0d1117" stroke="#63d4a0" stroke-width="1.2"/>
<g transform="translate(57 268) scale(0.75)" fill="none" stroke="#63d4a0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></g>
<text x="86" y="273" font-size="14" fill="#e6edf3" font-weight="700">Own address space</text>
<text x="86" y="292" font-size="12.5" fill="#9ba7b3">per cell, lower half only</text>
<rect x="288" y="246" width="228" height="62" rx="10" fill="#0d1117" stroke="#63d4a0" stroke-width="1.2"/>
<g transform="translate(301 268) scale(0.75)" fill="none" stroke="#63d4a0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></g>
<text x="330" y="273" font-size="14" fill="#e6edf3" font-weight="700">Quotas</text>
<text x="330" y="292" font-size="12.5" fill="#9ba7b3">memory, CPU, sockets</text>
<rect x="532" y="246" width="228" height="62" rx="10" fill="#0d1117" stroke="#63d4a0" stroke-width="1.2"/>
<g transform="translate(545 268) scale(0.75)" fill="none" stroke="#63d4a0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></g>
<text x="574" y="273" font-size="14" fill="#e6edf3" font-weight="700">KPTI · E0PD</text>
<text x="574" y="292" font-size="12.5" fill="#9ba7b3">Meltdown closed</text>
<rect x="44" y="316" width="228" height="62" rx="10" fill="#0d1117" stroke="#63d4a0" stroke-width="1.2"/>
<g transform="translate(57 338) scale(0.75)" fill="none" stroke="#63d4a0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></g>
<text x="86" y="343" font-size="14" fill="#e6edf3" font-weight="700">SMEP · SMAP · PAN</text>
<text x="86" y="362" font-size="12.5" fill="#9ba7b3">kernel stays out</text>
<rect x="288" y="316" width="228" height="62" rx="10" fill="#0d1117" stroke="#63d4a0" stroke-width="1.2"/>
<g transform="translate(301 338) scale(0.75)" fill="none" stroke="#63d4a0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></g>
<text x="330" y="343" font-size="14" fill="#e6edf3" font-weight="700">Write or execute</text>
<text x="330" y="362" font-size="12.5" fill="#9ba7b3">never both, JIT too</text>
<rect x="532" y="316" width="228" height="62" rx="10" fill="#0d1117" stroke="#63d4a0" stroke-width="1.2"/>
<g transform="translate(545 338) scale(0.75)" fill="none" stroke="#63d4a0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></g>
<text x="574" y="343" font-size="14" fill="#e6edf3" font-weight="700">Zeroed memory</text>
<text x="574" y="362" font-size="12.5" fill="#9ba7b3">nothing leaks on reuse</text>
<line x1="209" y1="396" x2="209" y2="416" stroke="#79b8ff" stroke-width="2"/>
<rect x="24" y="416" width="370" height="62" rx="12" fill="#0f2440" stroke="#3f7dc4" stroke-width="1.5"/>
<text x="44" y="442" font-size="14" fill="#e6edf3" font-weight="700">Host control requests</text>
<text x="44" y="462" font-size="12.5" fill="#9ba7b3">trusted, but decoded defensively</text>
<rect x="406" y="416" width="370" height="62" rx="12" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/>
<text x="426" y="442" font-size="14" fill="#e6edf3" font-weight="700">VMM, firmware, hardware</text>
<text x="426" y="462" font-size="12.5" fill="#9ba7b3">trusted, out of scope</text>
<line x1="24" y1="496" x2="776" y2="496" stroke="#6e7681" stroke-width="1"/>
<g transform="translate(30 512) scale(0.833333)" fill="none" stroke="#63d4a0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></g>
<text x="60" y="519" font-size="14" fill="#e6edf3" font-weight="700">3 internal reviews</text>
<text x="60" y="538" font-size="12.5" fill="#9ba7b3">22 findings fixed, 1 worked around</text>
<g transform="translate(284 512) scale(0.833333)" fill="none" stroke="#63d4a0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></g>
<text x="314" y="519" font-size="14" fill="#e6edf3" font-weight="700">Fuzzers, hostile cells</text>
