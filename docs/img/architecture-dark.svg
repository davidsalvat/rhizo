<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Architecture of Rhizo</title>
<desc>On the host machine, the rhizo command-line tool talks to a small server, which drives one virtual machine over its serial line. The VMM (QEMU, Firecracker or Cloud Hypervisor) runs the Rhizo kernel; above it run the cells, unmodified Linux programs. The kernel is a set of Rust crates: the control loop, Linux system calls, sockets, files, memory, the scheduler, cells and snapshots, over narrow hardware interfaces for AArch64 and x86_64 and virtio devices. Cells reach the model through the virtual network card.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b98a5"/></marker><marker id="g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#63d4a0"/></marker><marker id="b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#79b8ff"/></marker><marker id="o" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f2c14e"/></marker><marker id="r" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff8a80"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="799" height="599" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="24" y="40" font-size="20" fill="#e6edf3" font-weight="700">How it fits together</text>
<rect x="24" y="80" width="752" height="504" rx="16" fill="#0d1117" stroke="#6e7681" stroke-width="1.5"/>
<text x="40" y="104" font-size="13.5" fill="#9ba7b3" font-weight="700">Host machine (Linux with KVM)</text>
<rect x="40" y="116" width="160" height="62" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/>
<text x="120.0" y="142" font-size="14" fill="#e6edf3" font-weight="700" text-anchor="middle">rhizo CLI</text>
<text x="120.0" y="162" font-size="12" fill="#9ba7b3" text-anchor="middle">up · run · fork · chat</text>
<rect x="224" y="116" width="170" height="62" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/>
<text x="309.0" y="142" font-size="14" fill="#e6edf3" font-weight="700" text-anchor="middle">rhizo server</text>
<text x="309.0" y="162" font-size="12" fill="#9ba7b3" text-anchor="middle">owns the VM</text>
<rect x="560" y="116" width="200" height="62" rx="10" fill="#0f2440" stroke="#3f7dc4" stroke-width="1.5"/>
<text x="660.0" y="142" font-size="14" fill="#e6edf3" font-weight="700" text-anchor="middle">Your model</text>
<text x="660.0" y="162" font-size="12" fill="#9ba7b3" text-anchor="middle">Ollama, llama.cpp…</text>
<line x1="200" y1="147" x2="224" y2="147" stroke="#8b98a5" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="40" y="200" width="720" height="368" rx="14" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/>
<text x="216" y="226" font-size="13.5" fill="#9ba7b3" font-weight="700">One VM: QEMU, Firecracker or Cloud Hypervisor</text>
<text x="64" y="260" font-size="12.5" fill="#9ba7b3">cells: Linux</text>
<text x="64" y="277" font-size="12.5" fill="#9ba7b3">programs</text>
<rect x="290" y="240" width="96" height="46" rx="20" fill="#0f2440" stroke="#3f7dc4" stroke-width="1.5"/>
<text x="338" y="268" font-size="13.5" fill="#e6edf3" font-weight="700" text-anchor="middle">agent</text>
<rect x="396" y="240" width="96" height="46" rx="20" fill="#0f2440" stroke="#3f7dc4" stroke-width="1.5"/>
<text x="444" y="268" font-size="13.5" fill="#e6edf3" font-weight="700" text-anchor="middle">fork</text>
<rect x="502" y="240" width="96" height="46" rx="20" fill="#0f2440" stroke="#3f7dc4" stroke-width="1.5"/>
<text x="550" y="268" font-size="13.5" fill="#e6edf3" font-weight="700" text-anchor="middle">template</text>
<rect x="608" y="240" width="96" height="46" rx="20" fill="#0f2440" stroke="#3f7dc4" stroke-width="1.5"/>
<text x="656" y="268" font-size="13.5" fill="#e6edf3" font-weight="700" text-anchor="middle">tools</text>
<rect x="56" y="302" width="688" height="250" rx="14" fill="#0f2a1f" stroke="#63d4a0" stroke-width="2"/>
<text x="72" y="330" font-size="15" fill="#e6edf3" font-weight="700">Rhizo kernel</text>
<text x="728" y="330" font-size="12.5" fill="#9ba7b3" text-anchor="end">Rust, no_std, MIT</text>
<rect x="72" y="344" width="160" height="62" rx="8" fill="#0d1117" stroke="#63d4a0" stroke-width="1.2"/>
<text x="152.0" y="371" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="middle">Control loop</text>
<text x="152.0" y="390" font-size="12" fill="#9ba7b3" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rhizo-control</text>
<rect x="240" y="344" width="160" height="62" rx="8" fill="#0d1117" stroke="#63d4a0" stroke-width="1.2"/>
<text x="320.0" y="371" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="middle">Linux system calls</text>
<text x="320.0" y="390" font-size="12" fill="#9ba7b3" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rhizo-abi</text>
<rect x="408" y="344" width="160" height="62" rx="8" fill="#0d1117" stroke="#63d4a0" stroke-width="1.2"/>
<text x="488.0" y="371" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="middle">Sockets</text>
<text x="488.0" y="390" font-size="12" fill="#9ba7b3" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rhizo-net</text>
<rect x="576" y="344" width="160" height="62" rx="8" fill="#0d1117" stroke="#63d4a0" stroke-width="1.2"/>
<text x="656.0" y="371" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="middle">Files</text>
<text x="656.0" y="390" font-size="12" fill="#9ba7b3" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rhizo-fs</text>
<rect x="72" y="414" width="160" height="62" rx="8" fill="#0d1117" stroke="#63d4a0" stroke-width="1.2"/>
<text x="152.0" y="441" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="middle">Memory</text>
<text x="152.0" y="460" font-size="12" fill="#9ba7b3" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rhizo-mm</text>
<rect x="240" y="414" width="160" height="62" rx="8" fill="#0d1117" stroke="#63d4a0" stroke-width="1.2"/>
<text x="320.0" y="441" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="middle">Scheduler</text>
<text x="320.0" y="460" font-size="12" fill="#9ba7b3" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rhizo-sched</text>
<rect x="408" y="414" width="160" height="62" rx="8" fill="#0d1117" stroke="#63d4a0" stroke-width="1.2"/>
<text x="488.0" y="441" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="middle">Cells, ELF, quotas</text>
<text x="488.0" y="460" font-size="12" fill="#9ba7b3" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rhizo-cell</text>
<rect x="576" y="414" width="160" height="62" rx="8" fill="#0d1117" stroke="#63d4a0" stroke-width="1.2"/>
<text x="656.0" y="441" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="middle">Snapshots</text>
<text x="656.0" y="460" font-size="12" fill="#9ba7b3" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rhizo-snapshot</text>
<rect x="72" y="484" width="656" height="62" rx="8" fill="#0d1117" stroke="#6e7681" stroke-width="1.2"/>
<text x="400" y="509" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="middle">Narrow hardware interfaces: rhizo-hal, arch/ (AArch64, x86_64), virtio</text>
<text x="400" y="529" font-size="12" fill="#9ba7b3" text-anchor="middle">so the core runs and is tested on the host, deterministically</text>
<path d="M309 178 V 190 H 200 V 344" fill="none" stroke="#8b98a5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" stroke-dasharray="4 4"/>
