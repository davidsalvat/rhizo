<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>The model beside Rhizo</title>
<desc>Local architecture. On the user's computer, any model runtime (Ollama, llama.cpp, vLLM) runs on the host GPU or NPU with one shared copy of the weights. Next to it, the Rhizo VM runs agent cells, including a fork, and each agent keeps its own state in its cell. Cells talk to the model over a local socket, and the Rhizo app coordinates both. The app and the socket are planned.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b98a5"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="799" height="469" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="24" y="40" font-size="20" fill="#e6edf3" font-weight="700">The model beside Rhizo</text>
<text x="24" y="64" font-size="14" fill="#9ba7b3">Any model, any runtime, full GPU speed; agents in cells.</text>
<rect x="24" y="80" width="752" height="360" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
<text x="40" y="104" font-size="14" fill="#9ba7b3" font-weight="600">Your computer (Linux, macOS or Windows)</text>
<rect x="40" y="118" width="720" height="50" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="60" y="149" font-size="15" fill="#e6edf3" font-weight="600">Rhizo app: starts the VM, picks the model, manages agents</text>
<text x="744" y="149" font-size="12" fill="#9ba7b3" font-weight="700" text-anchor="end">planned</text>
<line x1="160" y1="168" x2="160" y2="196" stroke="#8b98a5" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="580" y1="168" x2="580" y2="196" stroke="#8b98a5" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="40" y="198" width="240" height="88" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<text x="56" y="226" font-size="16" fill="#e6edf3" font-weight="700">Model runtime</text>
<text x="56" y="248" font-size="14" fill="#9ba7b3">Ollama, llama.cpp, vLLM…</text>
<text x="56" y="270" font-size="14" fill="#9ba7b3">weights: one shared copy</text>
<line x1="160" y1="286" x2="160" y2="316" stroke="#8b98a5" stroke-width="1.8"/>
<rect x="40" y="318" width="240" height="56" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<text x="160" y="351" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">GPU / NPU</text>
<line x1="290" y1="242" x2="398" y2="242" stroke="#8b98a5" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="4 4"/>
<line x1="398" y1="262" x2="290" y2="262" stroke="#8b98a5" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="4 4"/>
<text x="344" y="230" font-size="13" fill="#9ba7b3" font-weight="600" text-anchor="middle">local socket</text>
<text x="344" y="284" font-size="12" fill="#9ba7b3" font-weight="700" text-anchor="middle">planned</text>
<rect x="400" y="198" width="360" height="226" rx="16" fill="#0f2a1f" stroke="#63d4a0" stroke-width="2"/>
<text x="416" y="224" font-size="16" fill="#e6edf3" font-weight="700">Rhizo VM</text>
<text x="416" y="246" font-size="13" fill="#9ba7b3">on KVM today; macOS and Windows planned</text>
<rect x="416" y="262" width="104" height="64" rx="28" fill="#0d1117" stroke="#63d4a0" stroke-width="1.5"/>
<text x="468" y="290" font-size="15" fill="#e6edf3" font-weight="700" text-anchor="middle">agent A</text>
<text x="468" y="310" font-size="13" fill="#9ba7b3" text-anchor="middle">cell</text>
<rect x="528" y="262" width="104" height="64" rx="28" fill="#0d1117" stroke="#63d4a0" stroke-width="1.5"/>
<text x="580" y="290" font-size="15" fill="#e6edf3" font-weight="700" text-anchor="middle">agent B</text>
<text x="580" y="310" font-size="13" fill="#9ba7b3" text-anchor="middle">cell</text>
<rect x="640" y="262" width="104" height="64" rx="28" fill="#0d1117" stroke="#63d4a0" stroke-width="1.5"/>
<text x="692" y="290" font-size="15" fill="#e6edf3" font-weight="700" text-anchor="middle">agent B′</text>
<text x="692" y="310" font-size="13" fill="#9ba7b3" text-anchor="middle">fork of B</text>
<text x="416" y="356" font-size="13" fill="#9ba7b3">Each agent's state (program, history,</text>
<text x="416" y="376" font-size="13" fill="#9ba7b3">files) lives in its cell: that is what</text>
<text x="416" y="396" font-size="13" fill="#9ba7b3">Rhizo suspends, resumes and forks.</text>
<text x="24" y="460" font-size="13" fill="#9ba7b3">Solid: built today. Dashed: planned.</text>
</svg>
