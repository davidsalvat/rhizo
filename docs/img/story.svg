<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>The life of a cell</title>
<desc>A cell's life in eight steps: 1. Create: an unmodified Linux program becomes a cell; 2. Run: threads, files, network, every CPU; 3. Suspend: its whole state frozen in memory; 4. Resume: it carries on where it stopped; 5. Fork: copies share memory until they write; 6. Freeze as template: warm it up once, start many from it; 7. Save to a file: a checked file you can copy; 8. Load elsewhere: another machine carries on.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#57706a"/></marker><marker id="g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f9d6b"/></marker><marker id="b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a5cc2"/></marker><marker id="o" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a6100"/></marker><marker id="r" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b42318"/></marker><marker id="c" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#146c4a"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="799" height="449" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="40" font-size="20" fill="#0e2a20" font-weight="700">The life of a cell</text>
<text x="24" y="64" font-size="14" fill="#4b5c55">Every step is a native operation of the kernel.</text>
<rect x="24" y="92" width="168" height="146" rx="16" fill="#eafaf2" stroke="#1f9d6b" stroke-width="2"/>
<circle cx="46" cy="114" r="12" fill="#146c4a" stroke="none" stroke-width="1.5"/>
<text x="46" y="119" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<circle cx="108.0" cy="134" r="22" fill="#ffffff" stroke="#146c4a" stroke-width="2"/>
<g transform="translate(95.5 121.5) scale(1.04167)" fill="none" stroke="#146c4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2 7 7 2-7 2-2 7-2-7-7-2 7-2z" fill="#146c4a" stroke="none"/></g>
<text x="108.0" y="179" font-size="15.5" fill="#0e2a20" font-weight="700" text-anchor="middle">Create</text>
<text x="108.0" y="200" font-size="12.5" fill="#4b5c55" text-anchor="middle">an unmodified Linux</text>
<text x="108.0" y="217" font-size="12.5" fill="#4b5c55" text-anchor="middle">program becomes a cell</text>
<line x1="193" y1="165.0" x2="218" y2="165.0" stroke="#57706a" stroke-width="2" marker-end="url(#a)"/>
<rect x="218" y="92" width="168" height="146" rx="16" fill="#eafaf2" stroke="#1f9d6b" stroke-width="2"/>
<circle cx="240" cy="114" r="12" fill="#146c4a" stroke="none" stroke-width="1.5"/>
<text x="240" y="119" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<circle cx="302.0" cy="134" r="22" fill="#ffffff" stroke="#146c4a" stroke-width="2"/>
<g transform="translate(289.5 121.5) scale(1.04167)" fill="none" stroke="#146c4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l13 8-13 8z" fill="#146c4a" stroke="none"/></g>
<text x="302.0" y="179" font-size="15.5" fill="#0e2a20" font-weight="700" text-anchor="middle">Run</text>
<text x="302.0" y="200" font-size="12.5" fill="#4b5c55" text-anchor="middle">threads, files,</text>
<text x="302.0" y="217" font-size="12.5" fill="#4b5c55" text-anchor="middle">network, every CPU</text>
<line x1="387" y1="165.0" x2="412" y2="165.0" stroke="#57706a" stroke-width="2" marker-end="url(#a)"/>
<rect x="412" y="92" width="168" height="146" rx="16" fill="#eafaf2" stroke="#1f9d6b" stroke-width="2"/>
<circle cx="434" cy="114" r="12" fill="#146c4a" stroke="none" stroke-width="1.5"/>
<text x="434" y="119" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<circle cx="496.0" cy="134" r="22" fill="#ffffff" stroke="#146c4a" stroke-width="2"/>
<g transform="translate(483.5 121.5) scale(1.04167)" fill="none" stroke="#146c4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="4" height="14" rx="1" fill="#146c4a"/><rect x="14" y="5" width="4" height="14" rx="1" fill="#146c4a"/></g>
<text x="496.0" y="179" font-size="15.5" fill="#0e2a20" font-weight="700" text-anchor="middle">Suspend</text>
<text x="496.0" y="200" font-size="12.5" fill="#4b5c55" text-anchor="middle">its whole state</text>
<text x="496.0" y="217" font-size="12.5" fill="#4b5c55" text-anchor="middle">frozen in memory</text>
<line x1="581" y1="165.0" x2="606" y2="165.0" stroke="#57706a" stroke-width="2" marker-end="url(#a)"/>
<rect x="606" y="92" width="168" height="146" rx="16" fill="#eafaf2" stroke="#1f9d6b" stroke-width="2"/>
<circle cx="628" cy="114" r="12" fill="#146c4a" stroke="none" stroke-width="1.5"/>
<text x="628" y="119" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<circle cx="690.0" cy="134" r="22" fill="#ffffff" stroke="#146c4a" stroke-width="2"/>
<g transform="translate(677.5 121.5) scale(1.04167)" fill="none" stroke="#146c4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 3v5h-5"/><path d="M10 9l5 3-5 3z" fill="#146c4a" stroke="none"/></g>
<text x="690.0" y="179" font-size="15.5" fill="#0e2a20" font-weight="700" text-anchor="middle">Resume</text>
<text x="690.0" y="200" font-size="12.5" fill="#4b5c55" text-anchor="middle">it carries on</text>
<text x="690.0" y="217" font-size="12.5" fill="#4b5c55" text-anchor="middle">where it stopped</text>
<rect x="24" y="280" width="168" height="146" rx="16" fill="#eafaf2" stroke="#1f9d6b" stroke-width="2"/>
<circle cx="46" cy="302" r="12" fill="#146c4a" stroke="none" stroke-width="1.5"/>
<text x="46" y="307" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<circle cx="108.0" cy="322" r="22" fill="#ffffff" stroke="#146c4a" stroke-width="2"/>
<g transform="translate(95.5 309.5) scale(1.04167)" fill="none" stroke="#146c4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2.5"/><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M6 7.5v9"/><path d="M18 7.5c0 5-12 4-12 9"/></g>
<text x="108.0" y="367" font-size="15.5" fill="#0e2a20" font-weight="700" text-anchor="middle">Fork</text>
<text x="108.0" y="388" font-size="12.5" fill="#4b5c55" text-anchor="middle">copies share memory</text>
<text x="108.0" y="405" font-size="12.5" fill="#4b5c55" text-anchor="middle">until they write</text>
<line x1="193" y1="353.0" x2="218" y2="353.0" stroke="#57706a" stroke-width="2" marker-end="url(#a)"/>
<rect x="218" y="280" width="168" height="146" rx="16" fill="#eafaf2" stroke="#1f9d6b" stroke-width="2"/>
<circle cx="240" cy="302" r="12" fill="#146c4a" stroke="none" stroke-width="1.5"/>
<text x="240" y="307" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
<circle cx="302.0" cy="322" r="22" fill="#ffffff" stroke="#146c4a" stroke-width="2"/>
<g transform="translate(289.5 309.5) scale(1.04167)" fill="none" stroke="#146c4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/><path d="M9.5 3.5L12 6l2.5-2.5M9.5 20.5L12 18l2.5 2.5"/></g>
<text x="302.0" y="367" font-size="15.5" fill="#0e2a20" font-weight="700" text-anchor="middle">Freeze as template</text>
<text x="302.0" y="388" font-size="12.5" fill="#4b5c55" text-anchor="middle">warm it up once,</text>
<text x="302.0" y="405" font-size="12.5" fill="#4b5c55" text-anchor="middle">start many from it</text>
<line x1="387" y1="353.0" x2="412" y2="353.0" stroke="#57706a" stroke-width="2" marker-end="url(#a)"/>
<rect x="412" y="280" width="168" height="146" rx="16" fill="#eafaf2" stroke="#1f9d6b" stroke-width="2"/>
<circle cx="434" cy="302" r="12" fill="#146c4a" stroke="none" stroke-width="1.5"/>
<text x="434" y="307" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">7</text>
<circle cx="496.0" cy="322" r="22" fill="#ffffff" stroke="#146c4a" stroke-width="2"/>
<g transform="translate(483.5 309.5) scale(1.04167)" fill="none" stroke="#146c4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3"/><rect x="8" y="13" width="8" height="6" rx="1"/></g>
<text x="496.0" y="367" font-size="15.5" fill="#0e2a20" font-weight="700" text-anchor="middle">Save to a file</text>
<text x="496.0" y="388" font-size="12.5" fill="#4b5c55" text-anchor="middle">a checked file</text>
<text x="496.0" y="405" font-size="12.5" fill="#4b5c55" text-anchor="middle">you can copy</text>
<line x1="581" y1="353.0" x2="606" y2="353.0" stroke="#57706a" stroke-width="2" marker-end="url(#a)"/>
<rect x="606" y="280" width="168" height="146" rx="16" fill="#e3f0ff" stroke="#3f80cf" stroke-width="2"/>
<circle cx="628" cy="302" r="12" fill="#0a5cc2" stroke="none" stroke-width="1.5"/>
<text x="628" y="307" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">8</text>
<circle cx="690.0" cy="322" r="22" fill="#ffffff" stroke="#0a5cc2" stroke-width="2"/>
<g transform="translate(677.5 309.5) scale(1.04167)" fill="none" stroke="#0a5cc2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></g>
<text x="690.0" y="367" font-size="15.5" fill="#0e2a20" font-weight="700" text-anchor="middle">Load elsewhere</text>
<text x="690.0" y="388" font-size="12.5" fill="#4b5c55" text-anchor="middle">another machine</text>
<text x="690.0" y="405" font-size="12.5" fill="#4b5c55" text-anchor="middle">carries on</text>
<path d="M690.0 238 V 259 H 108.0 V 280" fill="none" stroke="#57706a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
</svg>
