<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Designed: abilities as child cells</title>
<desc>Designed, not built yet. A small static chat agent starts with egress to its model only. Each task that needs an ability adds a child cell, forked from a signed, warm template and reached only over a channel: “Analyse this sheet and chart it” adds data analysis (Python, pandas, plotting), egress: none; “Fix the failing test in my repo” adds coding tools (git, Node.js, a test runner), egress: proxy only; “Check this on a website” adds web browser (headless Chromium), egress: allowlist; “Read these invoices” adds documents (PDF reader, OCR), egress: none; “Update the customer record” adds your own tools (your MCP servers: CRM, database), egress: you choose. The web browser is the sensitive one: the parent or the operator approves it first, and it may reach only allowed sites. Children fork in milliseconds from templates that share their base runtime (measured for CPython and Node.js). Templates are built by a builder cell through rhizo proxy from a lockfile and signed by the operator. Every child talks only to its agent, over a channel, with a budget carved from the agent's and never more egress; what the browser reads stays in that agent's tree.</desc>
