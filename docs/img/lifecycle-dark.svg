<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>What a cell can do</title>
<desc>A cell is created from a static executable. A running cell can be suspended into a snapshot and resumed, forked into copy-on-write children, or frozen as a template that new cells start from.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b98a5"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="799" height="439" rx="12" fill="#0d1117" stroke="#30363d"/>
<rect x="24" y="168" width="150" height="64" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<text x="99" y="196" font-size="15" fill="#e6edf3" text-anchor="middle">Static Linux</text>
<text x="99" y="216" font-size="15" fill="#e6edf3" text-anchor="middle">executable</text>
<line x1="174" y1="200" x2="248" y2="200" stroke="#8b98a5" stroke-width="1.8" marker-end="url(#a)"/>
<text x="211" y="190" font-size="14" fill="#9ba7b3" font-weight="600" text-anchor="middle">create</text>
<rect x="250" y="160" width="220" height="80" rx="24" fill="#0f2a1f" stroke="#63d4a0" stroke-width="2"/>
<text x="360" y="196" font-size="17" fill="#e6edf3" font-weight="700" text-anchor="middle">Running cell</text>
<text x="360" y="218" font-size="14" fill="#9ba7b3" text-anchor="middle">memory · registers · files</text>
<rect x="290" y="24" width="140" height="56" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="360" y="57" font-size="16" fill="#e6edf3" font-weight="600" text-anchor="middle">Snapshot</text>
<line x1="330" y1="158" x2="330" y2="82" stroke="#8b98a5" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="390" y1="82" x2="390" y2="158" stroke="#8b98a5" stroke-width="1.8" marker-end="url(#a)"/>
<text x="320" y="125" font-size="14" fill="#9ba7b3" font-weight="600" text-anchor="end">suspend</text>
<text x="400" y="116" font-size="14" fill="#9ba7b3" font-weight="600">resume</text>
<text x="400" y="136" font-size="14" fill="#63d4a0" font-weight="700">0.93 µs</text>
<line x1="470" y1="200" x2="562" y2="200" stroke="#8b98a5" stroke-width="1.8" marker-end="url(#a)"/>
<text x="516" y="190" font-size="14" fill="#9ba7b3" font-weight="600" text-anchor="middle">fork(n)</text>
<text x="516" y="222" font-size="14" fill="#63d4a0" font-weight="700" text-anchor="middle">1.29 µs</text>
<rect x="588" y="174" width="170" height="64" rx="32" fill="#0f2a1f" stroke="#63d4a0" stroke-width="1.5"/>
<rect x="576" y="162" width="170" height="64" rx="32" fill="#0f2a1f" stroke="#63d4a0" stroke-width="1.5"/>
<rect x="564" y="150" width="170" height="64" rx="32" fill="#0f2a1f" stroke="#63d4a0" stroke-width="1.5"/>
<text x="649" y="180" font-size="16" fill="#e6edf3" font-weight="600" text-anchor="middle">Children</text>
<text x="649" y="200" font-size="14" fill="#9ba7b3" text-anchor="middle">copy-on-write</text>
<text x="661" y="266" font-size="14" fill="#9ba7b3" text-anchor="middle">share pages until one writes</text>
<line x1="360" y1="242" x2="360" y2="320" stroke="#8b98a5" stroke-width="1.8" marker-end="url(#a)"/>
<text x="370" y="286" font-size="14" fill="#9ba7b3" font-weight="600">freeze</text>
<rect x="290" y="322" width="140" height="56" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="360" y="355" font-size="16" fill="#e6edf3" font-weight="600" text-anchor="middle">Template</text>
<line x1="430" y1="350" x2="562" y2="350" stroke="#8b98a5" stroke-width="1.8" marker-end="url(#a)"/>
<text x="496" y="340" font-size="14" fill="#9ba7b3" font-weight="600" text-anchor="middle">start</text>
<text x="496" y="372" font-size="14" fill="#63d4a0" font-weight="700" text-anchor="middle">0.33 µs</text>
<rect x="564" y="318" width="170" height="64" rx="32" fill="#0f2a1f" stroke="#63d4a0" stroke-width="1.5"/>
<text x="649" y="346" font-size="16" fill="#e6edf3" font-weight="600" text-anchor="middle">New cells</text>
<text x="649" y="366" font-size="14" fill="#9ba7b3" text-anchor="middle">already warmed up</text>
<text x="24" y="420" font-size="14" fill="#9ba7b3">Times: medians on a GitHub-hosted runner with KVM (see the chart below).</text>
</svg>
