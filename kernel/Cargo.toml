[package]
name = "rhizo-kernel"
description = "The Rhizo kernel image"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Not published to crates.io (workspace path dependencies only).
publish = false

[[bin]]
name = "rhizo-kernel"
test = false
bench = false

[features]
# Builds that run cells (set by `ktest`, `bench-cell` and `control`, never
# alone): the cell host, preemption, the other CPUs and the network card.
cells = []
# Test build: run the in-kernel test suite instead of the normal boot path
# (with cost accounting and sampling built in, which it tests), or, with
# `selfcheck=NAME` on its command line, one harness self-check that must
# fail in a precise way (`cargo xtask test`, change `fewer-kernel-builds`).
# Test code stays behind this one feature: no other build contains it.
ktest = ["cells", "sampling"]
# Node.js builds (change `add-node-workload`): embed `node-files` (over
# 100 MiB, so only here); with `ktest`, run the Node.js tests only, with
# `bench-cell`, measure the Node.js workload only. Their VMs get more memory.
node = []
# Packages from PyPI (change `add-pip-packages`): embed `packages-files`
# (65 MiB: the dynamically linked CPython, numpy, requests); with `ktest`,
# run the package tests only, with `bench-cell`, measure numpy only. Their
# VMs get more memory.
packages = []
# Benchmark build: spawn and run the hello cell repeatedly and print
# `rhizo-cell spawn_ns=<median>` (`cargo xtask bench`).
bench-cell = ["cells"]
# Control build: serve the host's requests (run, suspend, resume, fork, kill
# cells) on the serial line instead of exiting (`rhizo up`, change
# `add-control-plane`).
control = ["cells"]
# Cost accounting (spec `profiling`): the kernel's hooks, compiled out
# otherwise; with `bench-cell`, print the breakdowns of the workloads
# instead of the benchmarks.
profile = []
# Cost accounting and sampling where cell code is (spec `profiling`): with
# `bench-cell`, the breakdowns with their samples (`cargo xtask profile`).
sampling = ["profile"]

[dependencies]
rhizo-hal = { path = "../crates/rhizo-hal" }
rhizo-core = { path = "../crates/rhizo-core" }
rhizo-mm = { path = "../crates/rhizo-mm" }
rhizo-cell = { path = "../crates/rhizo-cell" }
rhizo-abi = { path = "../crates/rhizo-abi" }
rhizo-sched = { path = "../crates/rhizo-sched" }
rhizo-snapshot = { path = "../crates/rhizo-snapshot" }
rhizo-fs = { path = "../crates/rhizo-fs" }
rhizo-net = { path = "../crates/rhizo-net" }
rhizo-virtio = { path = "../crates/rhizo-virtio" }
rhizo-control = { path = "../crates/rhizo-control" }
rhizo-prof = { path = "../crates/rhizo-prof" }
rhizo-cap = { path = "../crates/rhizo-cap" }

[lints]
workspace = true
