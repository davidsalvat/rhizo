[package]
name = "rhizo-kernel"
description = "The Rhizo kernel image"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Not published to crates.io (workspace path dependencies only).
publish = false

[[bin]]
name = "rhizo-kernel"
test = false
bench = false

[features]
# Test build: run the in-kernel test suite instead of the normal boot path.
ktest = []
# Harness self-checks used by `cargo xtask test`: each adds one failing test
# to prove panics, hangs, exceptions and out-of-memory are detected.
ktest-should-panic = ["ktest"]
ktest-hang = ["ktest"]
ktest-page-fault = ["ktest"]
ktest-stack-overflow = ["ktest"]
ktest-invalid-opcode = ["ktest"]
ktest-oom = ["ktest"]

[dependencies]
rhizo-hal = { path = "../crates/rhizo-hal" }
rhizo-core = { path = "../crates/rhizo-core" }
rhizo-mm = { path = "../crates/rhizo-mm" }

[lints]
workspace = true
