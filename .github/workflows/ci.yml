name: CI
# Temporary probe of change control-over-vsock (never merged).
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup
        with:
          qemu: qemu-system-x86
          sources: "true"
      - name: Control on qemu-microvm
        continue-on-error: true
        run: ls -l /dev/vhost-vsock; cargo xtask --arch x86_64 test --only control
      - name: Control on qemu-q35
        continue-on-error: true
        run: cargo xtask --arch x86_64 test --only control --vmm qemu-q35
      - name: Control on firecracker
        continue-on-error: true
        run: cargo xtask --arch x86_64 test --only control --vmm firecracker
      - name: Control on cloud-hypervisor
        continue-on-error: true
        run: cargo xtask --arch x86_64 test --only control --vmm cloud-hypervisor
  arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          qemu: qemu-system-arm
          sources: "true"
      - name: Control on qemu-virt
        continue-on-error: true
        run: ls -l /dev/vhost-vsock; cargo xtask test --only control
      - name: Bench control on qemu-virt (emulated)
        run: cargo xtask bench --workload control 2>&1 | tail -40
