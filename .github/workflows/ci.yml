name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Probe vhost-vsock
        run: |
          set -x
          uname -a
          ls -l /dev/vhost-vsock /dev/kvm /dev/vsock || true
          lsmod | grep -i vsock || true
          sudo -n modprobe vhost_vsock && echo modprobe-ok || echo modprobe-failed
          ls -l /dev/vhost-vsock || true
          lsmod | grep -i vsock || true
          sudo -n chmod 0666 /dev/vhost-vsock && echo chmod-ok || true
          ls -l /dev/vhost-vsock || true
          python3 -c "import socket; s=socket.socket(socket.AF_VSOCK, socket.SOCK_STREAM); print('af_vsock ok')" || true
          grep -i vsock /boot/config-$(uname -r) || true
          echo "::notice title=vsock-${{ matrix.os }}::$(ls -l /dev/vhost-vsock 2>&1) | $(lsmod | grep -i vsock | tr '\n' ' ')"
