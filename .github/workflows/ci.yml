name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: x86_64 fmt, clippy, tests (host and QEMU)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch MicroPython (pinned commit, MIT)
        # Built by xtask into a cell (cells/python); see xtask/src/main.rs.
        run: |
          dir="$RUNNER_TEMP/micropython"
          git init --quiet "$dir"
          git -C "$dir" fetch --quiet --depth 1 https://github.com/micropython/micropython.git ecfdd5d6f9be971852003c2049600dc7b3e2a838
          git -C "$dir" checkout --quiet FETCH_HEAD
          echo "RHIZO_MICROPYTHON_SRC=$dir" >> "$GITHUB_ENV"

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86
          qemu-system-x86_64 --version

      - name: Fetch CPython (pinned release, PSF license)
        # Built by xtask into a cell, which checks the tarball's SHA-256 and
        # builds zlib into it (xtask/src/cpython.rs).
        run: |
          sudo apt-get install -y --no-install-recommends zlib1g-dev
          tarball="$RUNNER_TEMP/Python-3.13.18.tar.xz"
          curl --fail --silent --show-error --location -o "$tarball" https://www.python.org/ftp/python/3.13.18/Python-3.13.18.tar.xz
          echo "RHIZO_CPYTHON_SRC=$tarball" >> "$GITHUB_ENV"

      - name: Enable KVM when the runner offers it
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Install the pinned Rust toolchain
        # Reads rust-toolchain.toml (channel, components, targets).
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Restore the CPython build
        id: cpython-cache
        uses: actions/cache/restore@v4
        with:
          path: target/cpython
          key: cpython-${{ runner.arch }}-${{ hashFiles('xtask/src/cpython.rs') }}

      - name: Run all checks
        run: cargo xtask --arch x86_64 ci 2>&1 | tee ci.log; exit "${PIPESTATUS[0]}"

      - name: Save the CPython build
        # Also when a later check failed: the build itself is done once its
        # recipe stamp exists.
        if: always() && steps.cpython-cache.outputs.cache-hit != 'true' && hashFiles('target/cpython/*/recipe') != ''
        uses: actions/cache/save@v4
        with:
          path: target/cpython
          key: cpython-${{ runner.arch }}-${{ hashFiles('xtask/src/cpython.rs') }}

      - name: Report the failure as an annotation
        if: failure()
        run: |
          log=ci.log
          [ -f "$log" ] || log=/dev/null
          echo "::error title=ci-log::$(tail -c 3000 "$log" | tr -d '\r' | sed -e 's/%/%25/g' | tr '\n' '|')"

  ci-arm64:
    name: AArch64 fmt, clippy, tests (QEMU virt)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch MicroPython (pinned commit, MIT)
        # Built by xtask into a cell (cells/python); see xtask/src/main.rs.
        run: |
          dir="$RUNNER_TEMP/micropython"
          git init --quiet "$dir"
          git -C "$dir" fetch --quiet --depth 1 https://github.com/micropython/micropython.git ecfdd5d6f9be971852003c2049600dc7b3e2a838
          git -C "$dir" checkout --quiet FETCH_HEAD
          echo "RHIZO_MICROPYTHON_SRC=$dir" >> "$GITHUB_ENV"

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm
          qemu-system-aarch64 --version

      - name: Fetch CPython (pinned release, PSF license)
        # Built by xtask into a cell, which checks the tarball's SHA-256 and
        # builds zlib into it (xtask/src/cpython.rs).
        run: |
          sudo apt-get install -y --no-install-recommends zlib1g-dev
          tarball="$RUNNER_TEMP/Python-3.13.18.tar.xz"
          curl --fail --silent --show-error --location -o "$tarball" https://www.python.org/ftp/python/3.13.18/Python-3.13.18.tar.xz
          echo "RHIZO_CPYTHON_SRC=$tarball" >> "$GITHUB_ENV"

      - name: Enable KVM when the runner offers it
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Report whether this runner offers KVM
        run: |
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "::notice title=kvm::/dev/kvm is usable on ubuntu-24.04-arm"
          elif [ -e /dev/kvm ]; then
            echo "::notice title=kvm::/dev/kvm exists but is not usable on ubuntu-24.04-arm: $(ls -l /dev/kvm)"
          else
            echo "::notice title=kvm::no /dev/kvm on ubuntu-24.04-arm (no hardware virtualization); AArch64 runs are emulated"
          fi

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 2>&1 | tee ci.log; exit "${PIPESTATUS[0]}"

      - uses: Swatinem/rust-cache@v2

      - name: Restore the CPython build
        id: cpython-cache
        uses: actions/cache/restore@v4
        with:
          path: target/cpython
          key: cpython-${{ runner.arch }}-${{ hashFiles('xtask/src/cpython.rs') }}

      - name: Run all checks
        run: cargo xtask --arch aarch64 ci 2>&1 | tee ci.log; exit "${PIPESTATUS[0]}"

      - name: Save the CPython build
        # Also when a later check failed: the build itself is done once its
        # recipe stamp exists.
        if: always() && steps.cpython-cache.outputs.cache-hit != 'true' && hashFiles('target/cpython/*/recipe') != ''
        uses: actions/cache/save@v4
        with:
          path: target/cpython
          key: cpython-${{ runner.arch }}-${{ hashFiles('xtask/src/cpython.rs') }}

      - name: Report the failure as an annotation
        if: failure()
        run: |
          log=ci.log
          [ -f "$log" ] || log=/dev/null
          echo "::error title=ci-log::$(tail -c 3000 "$log" | tr -d '\r' | sed -e 's/%/%25/g' | tr '\n' '|')"

  quality:
    name: dependency policy, unused dependencies, dependency rules
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Licenses, advisories, sources (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
      - name: Install cargo-machete and actionlint
        run: |
          cargo install --locked cargo-machete@0.9.1
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 "$HOME/.cargo/bin"
      - name: Unused dependencies (cargo-machete)
        run: cargo machete
      - name: Crate dependency rules and workflow files
        run: cargo xtask check

  miri:
    name: Miri on the heap allocator
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly with Miri (only for this job)
        run: rustup toolchain install nightly --profile minimal --component miri
      - name: Run heap tests under Miri
        env:
          PROPTEST_CASES: "8"
          # proptest reads its regression files; Miri isolates the file system.
          MIRIFLAGS: "-Zmiri-disable-isolation"
        run: "cargo +nightly miri test -p rhizo-mm -- heap::"

  bench:
    name: VMM boots and benchmark gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch MicroPython (pinned commit, MIT)
        # Built by xtask into a cell (cells/python); see xtask/src/main.rs.
        run: |
          dir="$RUNNER_TEMP/micropython"
          git init --quiet "$dir"
          git -C "$dir" fetch --quiet --depth 1 https://github.com/micropython/micropython.git ecfdd5d6f9be971852003c2049600dc7b3e2a838
          git -C "$dir" checkout --quiet FETCH_HEAD
          echo "RHIZO_MICROPYTHON_SRC=$dir" >> "$GITHUB_ENV"

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      - name: Fetch CPython (pinned release, PSF license)
        # Built by xtask into a cell, which checks the tarball's SHA-256 and
        # builds zlib into it (xtask/src/cpython.rs).
        run: |
          sudo apt-get install -y --no-install-recommends zlib1g-dev
          tarball="$RUNNER_TEMP/Python-3.13.18.tar.xz"
          curl --fail --silent --show-error --location -o "$tarball" https://www.python.org/ftp/python/3.13.18/Python-3.13.18.tar.xz
          echo "RHIZO_CPYTHON_SRC=$tarball" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install CRIU for the comparison
        # CRIU from Ubuntu's archive, else the CRIU project's PPA; when both
        # fail the CRIU comparison is skipped with the reason.
        run: |
          sudo apt-get install -y criu || {
            sudo add-apt-repository -y ppa:criu/ppa && sudo apt-get update && sudo apt-get install -y criu
          } || echo "CRIU not installed"
          criu --version || true
      - name: Install gVisor (runsc) for the comparison
        # A fixed gVisor release, checked against its published SHA-512
        # (Ubuntu's runsc is a 2023 build that fails on this runner).
        run: |
          base=https://storage.googleapis.com/gvisor/releases/release/20240603.0/x86_64
          curl --fail --silent --show-error --location -O "$base/runsc" -O "$base/runsc.sha512"
          sha512sum -c runsc.sha512
          sudo install -m 755 runsc /usr/local/bin/runsc
          runsc --version

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Restore the CPython build
        id: cpython-cache
        uses: actions/cache/restore@v4
        with:
          path: target/cpython
          key: cpython-${{ runner.arch }}-${{ hashFiles('xtask/src/cpython.rs') }}

      - name: Cache downloaded VMMs and reference guest
        uses: actions/cache@v4
        with:
          path: target/tools
          key: tools-${{ hashFiles('xtask/src/tools.rs') }}

      - name: Boot on Firecracker
        run: cargo xtask --arch x86_64 run --release --vmm firecracker

      - name: Boot on Cloud Hypervisor
        run: cargo xtask --arch x86_64 run --release --vmm cloud-hypervisor

      - name: In-kernel tests on Firecracker
        run: cargo xtask --arch x86_64 test --only ktest --vmm firecracker

      - name: In-kernel tests on 4 CPUs on Firecracker
        run: cargo xtask --arch x86_64 test --only ktest-smp --vmm firecracker

      - name: In-kernel tests on 4 CPUs on Cloud Hypervisor
        run: cargo xtask --arch x86_64 test --only ktest-smp --vmm cloud-hypervisor

      - name: Benchmarks and regression gate
        run: cargo xtask --arch x86_64 bench --env ci --check --output bench-results.json

      - name: Save the CPython build
        # Also when a later check failed: the build itself is done once its
        # recipe stamp exists.
        if: always() && steps.cpython-cache.outputs.cache-hit != 'true' && hashFiles('target/cpython/*/recipe') != ''
        uses: actions/cache/save@v4
        with:
          path: target/cpython
          key: cpython-${{ runner.arch }}-${{ hashFiles('xtask/src/cpython.rs') }}

      - name: Publish results
        if: always()
        run: |
          if [ -f bench-results.json ]; then
            # Annotations are cut at 4 KB: medians first, one per metric.
            echo "::notice title=bench-medians::$(jq -r '.metrics[] | "\(.name)/\(.guest)/\(.vmm // "-")=\(.median)"' bench-results.json | tr '\n' ' ')"
          fi

      # The full results, compact, in numbered pieces that each fit an
      # annotation (bench-results-1 to -36); a step shows at most 10 notices.
      - name: Publish full results (1 to 9)
        if: always()
        run: bash .github/publish-bench.sh 1
      - name: Publish full results (10 to 18)
        if: always()
        run: bash .github/publish-bench.sh 10
      - name: Publish full results (19 to 27)
        if: always()
        run: bash .github/publish-bench.sh 19
      - name: Publish full results (28 to 36)
        if: always()
        run: bash .github/publish-bench.sh 28
