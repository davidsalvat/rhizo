name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt, clippy, tests (host and QEMU)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86
          qemu-system-x86_64 --version

      - name: Enable KVM when the runner offers it
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Install the pinned Rust toolchain
        # Reads rust-toolchain.toml (channel, components, targets).
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Run all checks
        run: cargo xtask ci

  quality:
    name: dependency policy, unused dependencies, dependency rules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete,actionlint
      - name: Licenses, advisories, sources (cargo-deny)
        run: cargo deny check 2>&1 | tee quality.log; exit "${PIPESTATUS[0]}"
      - name: Unused dependencies (cargo-machete)
        run: cargo machete 2>&1 | tee -a quality.log; exit "${PIPESTATUS[0]}"
      - name: Crate dependency rules and workflow files
        run: cargo xtask check 2>&1 | tee -a quality.log; exit "${PIPESTATUS[0]}"
      - name: Report the failure as an annotation
        if: failure()
        run: |
          if [ -f quality.log ]; then
            echo "::error title=quality-log::$(tail -c 3000 quality.log | sed -e 's/%/%25/g' | tr '\n' '|')"
          fi

  miri:
    name: Miri on the heap allocator
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly with Miri (only for this job)
        run: rustup toolchain install nightly --profile minimal --component miri
      - name: Run heap tests under Miri
        env:
          PROPTEST_CASES: "8"
          # proptest reads its regression files; Miri isolates the file system.
          MIRIFLAGS: "-Zmiri-disable-isolation"
        run: "cargo +nightly miri test -p rhizo-mm -- heap::"

  bench:
    name: VMM boots and benchmark gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Cache downloaded VMMs and reference guest
        uses: actions/cache@v4
        with:
          path: target/tools
          key: tools-${{ hashFiles('xtask/src/tools.rs') }}

      - name: Boot on Firecracker
        run: cargo xtask run --release --vmm firecracker

      - name: Boot on Cloud Hypervisor
        run: cargo xtask run --release --vmm cloud-hypervisor

      - name: Benchmarks and regression gate
        run: cargo xtask bench --env ci --check --output bench-results.json

      - name: Publish results
        if: always()
        run: |
          if [ -f bench-results.json ]; then
            echo "::notice title=bench-results::$(tr -d '\n' < bench-results.json)"
          fi
