name: CI

# What a change runs depends on the paths it touches (change `faster-ci`,
# spec `developer-feedback`): `changes` classifies the diff as docs,
# host-tools or code; docs run only the `docs` job, host-tools add the quick
# checks and the control plane, code runs everything. Pushes to main run
# everything. Timing benchmarks run in bench.yml (main and nightly); pull
# requests are gated on instruction counts only. `ci-ok` is the one job
# branch protection should require. Every job starts right after `changes`;
# a failing `quick` cancels the run (change `faster-ci-2`).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Classify the change
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      class: ${{ steps.classify.outputs.class }}
      changes: ${{ steps.classify.outputs.changes }}
      images: ${{ steps.classify.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify the changed paths
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) git diff --name-only "$BASE...$HEAD" > changed.txt ;;
            push) git diff --name-only "$BEFORE" HEAD > changed.txt 2>/dev/null || : > changed.txt ;;
            *) : > changed.txt ;;
          esac
          class=$(.github/scripts/classify.sh < changed.txt)
          # Pushes to main and manual runs run everything.
          [ "$EVENT" = pull_request ] || class=code
          changes=$(sed -n 's|^openspec/changes/\([^/]*\)/.*|\1|p' changed.txt | grep -vx archive | sort -u | tr '\n' ' ' || true)
          images=false
          if grep -qE '\.svg$|^docs/img/' changed.txt; then images=true; fi
          echo "$(wc -l < changed.txt) changed paths: class $class; changes: ${changes:-none}; images: $images"
          {
            echo "class=$class"
            echo "changes=$changes"
            echo "images=$images"
          } >> "$GITHUB_OUTPUT"

  docs:
    name: Specs, links and images
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install OpenSpec (pinned)
        run: npm install --global @fission-ai/openspec@2.1.1
      - name: Validate the specs
        run: openspec validate --specs --strict
      - name: Validate the changed changes
        env:
          CHANGES: ${{ needs.changes.outputs.changes }}
        run: |
          for id in $CHANGES; do
            if [ -d "openspec/changes/$id" ]; then openspec validate "$id" --strict; fi
          done
      - name: Relative links in Markdown
        run: python3 .github/scripts/check-links.py
      - name: Path classifier
        run: .github/scripts/classify-test.sh
      - name: Image checks (light and dark)
        if: needs.changes.outputs.images == 'true'
        run: |
          npm install --global playwright@1.63.0
          npx playwright install --with-deps chromium
          NODE_PATH=$(npm root --global) node docs/img/check.js

  quick:
    name: Quick checks (fmt, clippy, host tests, dependency rules)
    needs: changes
    if: needs.changes.outputs.class != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # To cancel the run when these checks fail.
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 "$HOME/.cargo/bin"
      - name: fmt, clippy (both architectures), host tests, dependency rules, workflow files
        run: cargo xtask check 2>&1 | tee ci.log; exit "${PIPESTATUS[0]}"
      - name: Report the failure as an annotation
        if: failure()
        run: |
          log=ci.log
          [ -f "$log" ] || log=/dev/null
          echo "::error title=ci-log::$(tail -c 3000 "$log" | tr -d '\r' | sed -e 's/%/%25/g' | tr '\n' '|')"
      - name: Cancel the other jobs
        # They started beside this one; a red quick check makes their
        # results moot, so they stop instead of using runners for minutes.
        # `ci-ok` still runs (it runs always) and fails on this job.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

  policy:
    name: Dependency policy, unused dependencies
    needs: changes
    if: needs.changes.outputs.class != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Licenses, advisories, sources (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
      - name: Install cargo-machete
        run: cargo install --locked cargo-machete@0.9.1
      - name: Unused dependencies (cargo-machete)
        run: cargo machete

  control-plane:
    name: Control plane through `rhizo` (host-tools changes)
    needs: changes
    if: needs.changes.outputs.class == 'host-tools'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          qemu: qemu-system-x86
      - name: Control plane step
        run: cargo xtask --arch x86_64 test --only control

  ci:
    name: x86_64 tests (host and QEMU)
    needs: changes
    if: needs.changes.outputs.class == 'code'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Downloads and packs the pinned Node.js build (xtask/src/tools.rs)
      # and runs its tests and benchmarks (change `add-node-workload`).
      RHIZO_NODE: "1"
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup
        with:
          qemu: qemu-system-x86
          sources: "true"
      - name: Run all checks
        run: cargo xtask --arch x86_64 ci 2>&1 | tee ci.log; exit "${PIPESTATUS[0]}"
      - name: Save the CPython build
        # Also when a later check failed: the build itself is done once its
        # recipe stamp exists.
        if: always() && steps.setup.outputs.cpython-hit != 'true' && hashFiles('target/cpython/*/recipe') != ''
        uses: actions/cache/save@v4
        with:
          path: target/cpython
          key: cpython-${{ runner.arch }}-${{ hashFiles('xtask/src/cpython.rs', 'xtask/src/packages.rs') }}
      - name: Report the failure as an annotation
        if: failure()
        run: |
          log=ci.log
          [ -f "$log" ] || log=/dev/null
          echo "::error title=ci-log::$(tail -c 3000 "$log" | tr -d '\r' | sed -e 's/%/%25/g' | tr '\n' '|')"

  vmm:
    name: x86_64 tests on Firecracker and Cloud Hypervisor (KVM)
    needs: changes
    if: needs.changes.outputs.class == 'code'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RHIZO_NODE: "1"
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup
        with:
          qemu: qemu-system-x86
          sources: "true"
      - name: Check KVM
        run: ls -l /dev/kvm
      - name: Boot on Firecracker
        run: cargo xtask --arch x86_64 run --release --vmm firecracker
      - name: Boot on Cloud Hypervisor
        run: cargo xtask --arch x86_64 run --release --vmm cloud-hypervisor
      - name: In-kernel tests on Firecracker
        run: cargo xtask --arch x86_64 test --only ktest --vmm firecracker
      - name: In-kernel tests on 4 CPUs on Firecracker
        run: cargo xtask --arch x86_64 test --only ktest-smp --vmm firecracker
      - name: In-kernel tests on 4 CPUs on Cloud Hypervisor
        run: cargo xtask --arch x86_64 test --only ktest-smp --vmm cloud-hypervisor
      - name: Node.js tests on Firecracker
        run: cargo xtask --arch x86_64 test --only ktest-node --vmm firecracker
      - name: Save the CPython build
        if: always() && steps.setup.outputs.cpython-hit != 'true' && hashFiles('target/cpython/*/recipe') != ''
        uses: actions/cache/save@v4
        with:
          path: target/cpython
          key: cpython-${{ runner.arch }}-${{ hashFiles('xtask/src/cpython.rs', 'xtask/src/packages.rs') }}

  icount-x86_64:
    # Pull requests only: on main, bench.yml measures these counts with
    # every other metric and gates them in the same `ci` environment.
    name: x86_64 instruction counts and gate (QEMU -icount)
    needs: changes
    if: needs.changes.outputs.class == 'code' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RHIZO_NODE: "1"
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup
        with:
          qemu: qemu-system-x86
          sources: "true"
      - name: Instruction counts and regression gate
        # Deterministic: each counted once; only the `-icount` metrics of
        # the `ci` baseline are compared (the VMM that ran).
        run: cargo xtask --arch x86_64 bench --icount-only --env ci --check --output bench-results-icount.json 2>&1 | tee ci.log; exit "${PIPESTATUS[0]}"
      - name: Save the CPython build
        if: always() && steps.setup.outputs.cpython-hit != 'true' && hashFiles('target/cpython/*/recipe') != ''
        uses: actions/cache/save@v4
        with:
          path: target/cpython
          key: cpython-${{ runner.arch }}-${{ hashFiles('xtask/src/cpython.rs', 'xtask/src/packages.rs') }}
      - name: Publish the instruction counts
        if: always()
        run: |
          if [ -f bench-results-icount.json ]; then
            echo "::notice title=bench-icount-medians::$(jq -r '.metrics[] | "\(.name)/\(.guest)/\(.vmm // "-")=\(.median)"' bench-results-icount.json | tr '\n' ' ')"
          fi
      - name: Report the failure as an annotation
        if: failure()
        run: |
          log=ci.log
          [ -f "$log" ] || log=/dev/null
          echo "::error title=ci-log::$(tail -c 3000 "$log" | tr -d '\r' | sed -e 's/%/%25/g' | tr '\n' '|')"

  ci-arm64:
    # Two runners share the steps of `xtask ci` (`--part`: every step runs
    # in exactly one part; part 1 also lints). Each runs its in-kernel
    # tests in two VMs that together run every test once (change
    # `shard-kernel-tests`).
    name: AArch64 tests, part ${{ matrix.part }} of 2 (host and QEMU virt)
    needs: changes
    if: needs.changes.outputs.class == 'code'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    env:
      RHIZO_NODE: "1"
      RHIZO_SHARDS: "2"
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup
        with:
          qemu: qemu-system-arm
          sources: "true"
      - name: Report whether this runner offers KVM
        run: |
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "::notice title=kvm::/dev/kvm is usable on ubuntu-24.04-arm"
          elif [ -e /dev/kvm ]; then
            echo "::notice title=kvm::/dev/kvm exists but is not usable on ubuntu-24.04-arm: $(ls -l /dev/kvm)"
          else
            echo "::notice title=kvm::no /dev/kvm on ubuntu-24.04-arm (no hardware virtualization); AArch64 runs are emulated"
          fi
      - name: Run all checks
        run: cargo xtask --arch aarch64 ci --part ${{ matrix.part }}/2 2>&1 | tee ci.log; exit "${PIPESTATUS[0]}"
      - name: Save the CPython build
        if: always() && steps.setup.outputs.cpython-hit != 'true' && hashFiles('target/cpython/*/recipe') != ''
        uses: actions/cache/save@v4
        with:
          path: target/cpython
          key: cpython-${{ runner.arch }}-${{ hashFiles('xtask/src/cpython.rs', 'xtask/src/packages.rs') }}
      - name: Report the failure as an annotation
        if: failure()
        run: |
          log=ci.log
          [ -f "$log" ] || log=/dev/null
          echo "::error title=ci-log::$(tail -c 3000 "$log" | tr -d '\r' | sed -e 's/%/%25/g' | tr '\n' '|')"

  icount-aarch64:
    name: AArch64 instruction counts and gate (QEMU virt -icount)
    needs: changes
    if: needs.changes.outputs.class == 'code'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      RHIZO_NODE: "1"
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup
        with:
          qemu: qemu-system-arm
          sources: "true"
      - name: Instruction counts and regression gate
        # GitHub's ARM64 runners have no KVM (bench/README.md), so AArch64
        # gets the figures that are exact under emulation: instructions
        # counted under QEMU -icount, once each, gated in `ci-arm`.
        run: cargo xtask --arch aarch64 bench --icount-only --env ci-arm --check --output bench-results-aarch64.json 2>&1 | tee ci.log; exit "${PIPESTATUS[0]}"
      - name: Save the CPython build
        if: always() && steps.setup.outputs.cpython-hit != 'true' && hashFiles('target/cpython/*/recipe') != ''
        uses: actions/cache/save@v4
        with:
          path: target/cpython
          key: cpython-${{ runner.arch }}-${{ hashFiles('xtask/src/cpython.rs', 'xtask/src/packages.rs') }}
      - name: Publish the instruction counts
        # Under their own title so the README tools can tell the
        # architectures apart: the medians, then the compact results in
        # pieces of 3000 bytes (about 5; GitHub keeps 10 per step).
        if: always()
        run: |
          if [ -f bench-results-aarch64.json ]; then
            echo "::notice title=bench-aarch64-medians::$(jq -r '.metrics[] | "\(.name)/\(.guest)/\(.vmm // "-")=\(.median)"' bench-results-aarch64.json | tr '\n' ' ')"
            jq -c . bench-results-aarch64.json | tr -d '\n' | fold -w 3000 | nl -nln -w1 -s' ' > bench-pieces.txt
            sed -n '1,9p' bench-pieces.txt | while IFS= read -r line; do
              echo "::notice title=bench-aarch64-results-${line%% *}::${line#* }"
            done
            [ "$(wc -l < bench-pieces.txt)" -le 9 ] || echo "::warning title=bench-aarch64::more than 9 pieces; add a publishing step"
          fi
      - name: Report the failure as an annotation
        if: failure()
        run: |
          log=ci.log
          [ -f "$log" ] || log=/dev/null
          echo "::error title=ci-log::$(tail -c 3000 "$log" | tr -d '\r' | sed -e 's/%/%25/g' | tr '\n' '|')"

  miri:
    name: Miri on the heap allocator
    needs: changes
    if: needs.changes.outputs.class == 'code'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly with Miri (only for this job)
        run: rustup toolchain install nightly --profile minimal --component miri
      - name: Run heap tests under Miri
        env:
          PROPTEST_CASES: "8"
          # proptest reads its regression files; Miri isolates the file system.
          MIRIFLAGS: "-Zmiri-disable-isolation"
        # Miri runs one test at a time: the two slowest (85 s each) run in
        # processes of their own beside a third with every other heap test,
        # so a new test lands in that one (change `faster-ci-2`).
        run: |
          cargo +nightly miri test -p rhizo-mm --no-run
          slow="heap::tests::allocations_never_overlap heap::tests::whole_free_pages_go_back_when_due"
          skips=""
          pids=""
          for t in $slow; do
            skips="$skips --skip $t"
            cargo +nightly miri test -p rhizo-mm -- --exact "$t" > "miri-${t##*::}.log" 2>&1 &
            pids="$pids $!"
          done
          # shellcheck disable=SC2086 # one word per option
          cargo +nightly miri test -p rhizo-mm -- heap:: $skips > miri-rest.log 2>&1 &
          pids="$pids $!"
          status=0
          for pid in $pids; do wait "$pid" || status=1; done
          cat miri-*.log
          exit "$status"

  ci-ok:
    # The one required check: every job above succeeded or was skipped on
    # purpose by its class. A job skipped because a job it needs failed
    # leaves that failure in this list, so it cannot pass unnoticed.
    name: ci-ok
    needs: [changes, docs, quick, policy, control-plane, ci, vmm, icount-x86_64, ci-arm64, icount-aarch64, miri]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded or was skipped by its class
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          CLASS: ${{ needs.changes.outputs.class }}
        run: |
          echo "class: ${CLASS:-unknown}; results: $RESULTS"
          bad=$(jq -r '[.[] | select(. != "success" and . != "skipped")] | length' <<< "$RESULTS")
          [ "$bad" = 0 ] || { echo "::error title=ci-ok::$bad job(s) failed or were cancelled"; exit 1; }
          [ -n "$CLASS" ] || { echo "::error title=ci-ok::the change was not classified"; exit 1; }
