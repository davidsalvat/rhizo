name: weekly

# Slow checks that do not belong on every pull request (see
# openspec/specs/code-quality-gates and developer-feedback).
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutants:
    name: Mutation testing (rhizo-mm, rhizo-core)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants
      - name: Run mutation testing
        run: cargo xtask mutants
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants.out

  proptest-random:
    name: Property tests with random seeds and more cases
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - name: Run with a random seed
        run: |
          seed=$(od -An -N8 -tu8 /dev/urandom | tr -d ' ')
          echo "PROPTEST_RNG_SEED=$seed (rerun a failure with this value)"
          PROPTEST_RNG_SEED=$seed PROPTEST_CASES=4096 cargo test -p rhizo-mm

  soak:
    name: Long reference workloads (server and laptop)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Cache downloaded VMMs
        uses: actions/cache@v4
        with:
          path: target/tools
          key: tools-${{ hashFiles('xtask/src/tools.rs') }}
      - name: Server workload, 10 minutes of load
        run: cargo xtask --arch x86_64 bench --workload server --soak --vmm firecracker --env ci --output soak-server.json
      - name: Laptop workload, 60 seconds idle
        run: cargo xtask --arch x86_64 bench --workload laptop --soak --vmm firecracker --env ci --output soak-laptop.json
      - name: Publish results
        if: always()
        run: |
          for f in soak-server.json soak-laptop.json; do
            if [ -f "$f" ]; then
              echo "::notice title=${f%.json}::$(jq -r '.metrics[] | "\(.name)/\(.vmm // "-")=\(.median)"' "$f" | tr '\n' ' ')"
            fi
          done
