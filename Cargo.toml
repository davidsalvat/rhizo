[workspace]
resolver = "3"
members = ["kernel", "cells", "crates/rhizo-hal", "crates/rhizo-core", "crates/rhizo-mm", "crates/rhizo-cell", "crates/rhizo-abi", "crates/rhizo-sched", "crates/rhizo-snapshot", "crates/rhizo-fs", "crates/rhizo-net", "crates/rhizo-virtio", "crates/rhizo-prof", "xtask"]
# The kernel only builds for the bare-metal target; plain `cargo` commands
# (test, clippy, build) operate on the host-buildable crates. Use
# `cargo xtask` for anything involving the kernel.
default-members = ["crates/rhizo-hal", "crates/rhizo-core", "crates/rhizo-mm", "crates/rhizo-cell", "crates/rhizo-abi", "crates/rhizo-sched", "crates/rhizo-snapshot", "crates/rhizo-fs", "crates/rhizo-net", "crates/rhizo-virtio", "crates/rhizo-prof", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/davidsalvat/rhizo"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
# Leftover debugging and placeholder code.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Libraries report through interfaces, never by printing (xtask opts out).
print_stdout = "warn"
print_stderr = "warn"
# Small, honest code.
redundant_clone = "warn"
needless_pass_by_value = "warn"
unused_self = "warn"

# Benchmarks always use this profile (see openspec/specs/boot-performance).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

# The ChaCha20 generator runs on every getrandom: optimized in test builds
# too, which run under emulation (design D1 of add-crypto-random).
[profile.dev.package.rhizo-core]
opt-level = 3
