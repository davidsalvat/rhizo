[package]
name = "rhizo-sched"
description = "Run queue and sleep list for Rhizo cells"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Not published to crates.io (workspace path dependencies only).
publish = false

[features]
# In-kernel test builds (the kernel's `ktest`): each domain's charged CPU
# time, exactly. Other builds do not count it, so a switch costs nothing
# more.
ktest = []

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
