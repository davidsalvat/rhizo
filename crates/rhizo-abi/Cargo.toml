[package]
name = "rhizo-abi"
description = "Linux system-call interface for Rhizo cells"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Not published to crates.io (workspace path dependencies only).
publish = false

[dependencies]
rhizo-hal = { path = "../rhizo-hal" }
rhizo-mm = { path = "../rhizo-mm" }
rhizo-cell = { path = "../rhizo-cell" }
rhizo-fs = { path = "../rhizo-fs" }
rhizo-net = { path = "../rhizo-net" }

[dev-dependencies]
proptest = "1"
rhizo-hal = { path = "../rhizo-hal", features = ["testing"] }
rhizo-cell = { path = "../rhizo-cell", features = ["testing"] }

[lints]
workspace = true
